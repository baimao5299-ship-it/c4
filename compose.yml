# C4 部署编排：单应用容器（内嵌前端）+ PostgreSQL + Redis。
# volume 全部使用目录挂载（bind mount），数据与配置落盘在宿主，便于备份与升级。
#
# 用法（compose 在根目录：自动发现 + 自动加载根目录 .env）：
#   cp .env.example .env（并填写 ADMIN_TOKEN、POSTGRES_PASSWORD、AUTH_JWT_SECRET）
#   docker compose up -d --build
#   # 或临时注入：ADMIN_TOKEN=$(openssl rand -hex 16) AUTH_JWT_SECRET=$(openssl rand -hex 32) \
#   #   docker compose up -d --build
#
# GHCR 快速上手（预构建镜像，release 流水线发布）：
#   docker pull ghcr.io/baimao5299-ship-it/c4:v0.0.1-beta.8
# 生产默认使用固定版本；需要跟随最新 beta 时显式设置完整的 IMAGE=...:beta。

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    # Keep a bounded host-side log even when the Docker daemon has no global
    # rotation policy. Limits are configurable in .env and only cap a service;
    # they do not reserve the full amount on the host.
    mem_limit: ${DB_MEMORY_LIMIT:-2g}
    cpus: ${DB_CPU_LIMIT:-2.0}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: c3api
    volumes:
      # 目录挂载：PG 数据落盘宿主 ./deploy/data/pg（备份/迁移直接拷目录）。
      # PG 18+ 要求挂载 /var/lib/postgresql（数据在 data 子目录，支持 pg_upgrade --link）。
      # 发布脚本通过 PG_DATA_DIR 指向版本目录外的共享路径，升级时不会换库。
      - ${PG_DATA_DIR:-./deploy/data/pg}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d c3api"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis 必需依赖（与 db 并列，非 profile 可选；spec 2026-08-25-redis-foundation-design
  # §4）：实例发现与短时效邮箱验证码等易失状态——可丢可重建，appendonly 关；永不作为 SoR/缓存层；勿配 allkeys-lru 等淘汰策略（验证码被淘汰仅致用户重发，无害但应避免）。
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    cpus: ${REDIS_CPU_LIMIT:-1.0}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # 镜像双形态（REL spec 2026-08-15）：本地开发/自建用 build（下方 build 块；
    # compose 语义 image+build 并存时 build 优先）；生产用 pull——删除 build 块、
    # 保留 image 即直接跑 GHCR 预构建镜像（docker compose pull && up -d）。
    # Override IMAGE for a private registry or a pinned release. Keeping the
    # published default makes both `up --build` and pull-only deployments work.
    # C4 is the primary image name. Set IMAGE explicitly to keep using an
    # existing private mirror or the legacy c3api compatibility package.
    image: ${IMAGE:-ghcr.io/baimao5299-ship-it/c4:v0.0.1-beta.8}
    build:
      context: .
      args:
        # Embed the release identifier in the binary so /version and support
        # reports identify the exact image currently serving traffic.
        C3API_VERSION: ${C3API_VERSION:-dev}
        # Vite embeds this public URL into the frontend bundle at build time.
        # Leave empty to show a clear not-configured state in the user portal.
        VITE_CARD_STORE_URL: ${VITE_CARD_STORE_URL:-}
        # Optional per-deployment brand; empty keeps the C4 default.
        VITE_APP_NAME: ${VITE_APP_NAME:-}
    restart: unless-stopped
    init: true
    mem_limit: ${APP_MEMORY_LIMIT:-4g}
    cpus: ${APP_CPU_LIMIT:-4.0}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    # Allow in-flight streaming requests and billing flushers to drain before
    # Docker sends SIGKILL during an upgrade or host reboot.
    stop_grace_period: 90s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 敏感项走环境变量（config.Load 支持 C3API_ADMIN_TOKEN / C3API_DB_DSN /
      # C3API_AUTH_JWT_SECRET / C3API_REDIS_ADDR 覆盖）
      # admin token required for the compose profile. This gives the first
      # administrator a deterministic bootstrap path; public registration never
      # grants admin by default (see auth.allow_first_user_admin).
      C3API_ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      C3API_AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env (openssl rand -hex 32)}
      C3API_DB_DSN: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/c3api?sslmode=disable
      C3API_REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      # 可选 GC 调优（默认关闭——空值 = 不设置 = Go 默认 GOGC=100 无软上限）：
      # 高并发（50k 并发 A/B 实测，24 核）开启 GOGC=off + GOMEMLIMIT=16GiB 后
      # QPS +14.5%（25.1k→28.75k/s）、每请求 CPU -27.7%（331→239µs）、
      # 首字节 -21%（1103→873ms）、p99 首字节 -36%（5785→3705ms）。
      # 代价：堆常驻 ~13G，GC 频率从 ~2-3s 一次降到 ~10s 一次（GOMEMLIMIT
      # 触发，64G 机器安全；调大 GOMEMLIMIT 可再降频，换内存占用）。
      # GOMEMLIMIT 只认纯字节数，勿带 G/GiB 等单位（非数字串启动即 fatal）。
      GOGC: ${GOGC:-}
      GOMEMLIMIT: ${GOMEMLIMIT:-}
    ports:
      # Localhost by default. Set BIND_ADDRESS explicitly (for example
      # 0.0.0.0) only when an HTTPS reverse proxy or firewall protects it.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-18080}:18080"
    volumes:
      # 目录挂载：配置只读注入（改配置重启即生效，不用重建镜像）。
      # 默认使用版本内已验证的生产配置。需要机器级覆盖时显式设置 CONFIG_FILE，
      # 例如 CONFIG_FILE=./deploy/config.local.toml；不要直接改发布模板。
      - ${CONFIG_FILE:-./deploy/config.toml}:/app/config.toml:ro
    healthcheck:
      # /readyz 会同时确认启动快照和已配置代理链路；/healthz 仅代表进程存活。
      # 基镜像 alpine:3.20 自带 busybox wget（无 curl），非 root 用户可执行。
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:18080/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
