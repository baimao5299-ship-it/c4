name: Release

# tag 触发（v* = semver tag，如 v0.0.1-beta.1）——tag 即发布源，不打 tag 不发布。
# Release has its own gate because a tag can be pushed before the branch CI
# finishes. Publishing is serialized so two tags cannot race on the floating
# `beta` image tag.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: c4-release-publish
  cancel-in-progress: false

# workflow 级权限（评审 P3-B）：gh release create 需 contents: write（建 Release
# 页 + 附附件）；GHCR 推送需 packages: write。默认 read 权限下二者都会 403。
permissions:
  contents: write
  packages: write

jobs:
  # A tag must pass the same core checks as main before any image or binary is
  # published. The real PostgreSQL service keeps repository tests meaningful.
  verify:
    name: release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: c3api_test
          POSTGRES_PASSWORD: c3api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        env:
          TEST_DATABASE_URL: postgres://postgres:c3api@localhost:5432/c3api_test?sslmode=disable
        run: go test -count=1 -p 1 ./...
        timeout-minutes: 30
      - name: generated Go contract check
        run: |
          go generate ./internal/handler/ ./internal/ent/
          git diff --exit-code
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: web install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: generated web contract check
        working-directory: web
        run: |
          pnpm gen:api
          git diff --exit-code
      - name: web lint
        working-directory: web
        run: pnpm run lint
      - name: web build
        working-directory: web
        run: pnpm run build

  # Job 1: 多平台镜像（linux/amd64 + linux/arm64）推 GHCR。
  image:
    name: image (GHCR multi-platform)
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4 # build-push 的 context 需要代码（评审 P3-A 补漏）
      - uses: docker/setup-qemu-action@v4 # 交叉构建 arm64 需 QEMU 模拟
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # GHA 缓存：pnpm/go 依赖层跨构建复用（首轮全量、后续命中层缓存）。
          # 配 Dockerfile --platform=$BUILDPLATFORM 原生构建后 QEMU 模拟面已消，
          # 缓存再吃掉依赖重下载。
          cache-from: type=gha, scope=c3api-build
          cache-to: type=gha, mode=max, scope=c3api-build
          # 版本 tag（如 v0.0.1-beta.1）+ beta 浮动 tag（compose/README 用户拉最新）。
          tags: |
            ghcr.io/${{ github.repository_owner }}/c4:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/c4:beta
            ghcr.io/${{ github.repository_owner }}/c3api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/c3api:beta
          # 版本注入：tag 值写进二进制 version（Dockerfile ARG C3API_VERSION）。
          build-args: |
            C3API_VERSION=${{ github.ref_name }}

  # Job 2: 五平台原生二进制（Release 附件），tar.gz 单格式（windows 同格式）。
  binaries:
    name: binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
    strategy:
      fail-fast: false # 单平台失败不拖垮其余平台产物
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # 显式装齐（评审 P3-A：runner 预装 Go 不保证与 go.mod 匹配）
      # 裸二进制同镜像一样必须携带控制台：cmd/server/embed.go 只嵌入
      # cmd/server/dist，而该目录在仓库中只有 .gitkeep（构建产物被忽略）。
      # 先构建 web，再复制到 embed 目录，避免发布出的二进制启动后没有 UI。
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build embedded console
        working-directory: web
        run: |
          set -euo pipefail
          pnpm install --config.node-linker=hoisted --frozen-lockfile
          pnpm run build
          rm -rf ../cmd/server/dist
          mkdir -p ../cmd/server/dist
          cp -r dist/. ../cmd/server/dist/
          touch ../cmd/server/dist/.gitkeep
      - name: Build and pack
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          bin="c3api"
          [ "$GOOS" = "windows" ] && bin="c3api.exe"
          # -trimpath 消除构建机路径泄漏；-X main.version 注入 tag 值（与镜像同源）
          go build -trimpath -ldflags "-s -w -X main.version=${tag}" -o "$bin" ./cmd/server
          tar -czf "c3api_${tag}_${GOOS}_${GOARCH}.tar.gz" "$bin"
      - uses: actions/upload-artifact@v7
        with:
          name: c3api-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: c3api_*.tar.gz
          if-no-files-found: error

  # Job 3: Release 页——附件 = 五平台 tar.gz + sha256sums.txt；body = CHANGELOG
  # 对应条目节选（评审 P3-C：找不到条目头显式失败，防空 body）。
  release:
    name: release
    runs-on: ubuntu-latest
    needs: [image, binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # CHANGELOG.md 节选需要代码
      - uses: actions/download-artifact@v8
        with:
          pattern: c3api-binaries-*
          merge-multiple: true
      - name: Generate sha256sums.txt
        # 全产物校验和：五平台 tar.gz 全部取齐后统一计算（矩阵各腿只产自身产物，
        # 单腿无法产出"全产物"校验和——合并点即校验点）。
        run: sha256sum c3api_*.tar.gz > sha256sums.txt
      - name: Extract CHANGELOG section
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          # 从 "## [${tag}]" 条目头起、到下一 "## " 头为止（多条目不越界）；
          # 找不到该条目头 → exit 1 显式失败（防忘更新 CHANGELOG 产生空 body）
          awk -v tag="## [$tag]" '
            index($0, tag) == 1 { found = 1; print; next }
            found && /^## / { exit }
            found { print }
            END { exit (found ? 0 : 1) }
          ' CHANGELOG.md > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --prerelease：beta 期发布恒为 Pre-release，不占 GitHub Latest 位
          # （latest = 正式稳定版语义，beta 不配位）。semver tag 的 -beta 段
          # 不会自动联动 prerelease 标志，须显式传。
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --prerelease \
            c3api_*.tar.gz sha256sums.txt
