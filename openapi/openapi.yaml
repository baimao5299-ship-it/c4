        - { name: group_id, in: query, schema: { type: integer, format: int64 } }
        - { name: account_id, in: query, schema: { type: integer, format: int64 } }
        - { name: user_id, in: query, schema: { type: integer, format: int64, description: 按用户过滤（admin 看全部） } }
        - { name: model, in: query, schema: { type: string } }
        - { name: status_code, in: query, schema: { type: integer } }
        - { name: error_type, in: query, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: 分页结果（next_cursor 非空表示还有下一页）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrLogsResponse' }
        default:
          $ref: '#/components/responses/Error'
  /stats:
    get:
      operationId: GetStats
      tags: [stats]
      summary: 用量统计聚合
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day], default: day } }
        - { name: group_id, in: query, schema: { type: integer, format: int64 } }
        - { name: account_id, in: query, schema: { type: integer, format: int64 } }
        - { name: user_id, in: query, schema: { type: integer, format: int64, description: 按用户过滤（admin 看全部） } }
        - { name: model, in: query, schema: { type: string } }
      responses:
        '200':
          description: 统计桶数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StatBucket' }
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: 错误响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    DeletedResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean }
    RequestFormat:
      type: string
      enum: [openai-chat, openai-responses, openai-images, anthropic]
    AccountStatus:
      type: string
      enum: [active, unhealthy, "429", disabled]
    ErrorType:
      type: string
      enum: [none, "429", "4xx", "5xx", network, auth, no_account, abort, billing]
    TemplateCreate:
      type: object
      required: [name, base_url, supported_formats]
      properties:
        name: { type: string }
        base_url: { type: string }
        # credential_type 模板级：一个模板 = 一种号池；缺省 = api_key。
        # 生态三类型（responses-special/codex-oauth/codex-pat）只支持 resp / resp-ws
        # 格式（service 校验）；类型化配置走 /templates/{id}/ext。
        credential_type: { type: string, enum: [api_key, responses-special, codex-oauth, codex-pat], default: api_key }
        supported_formats:
          type: array
          minItems: 1
          items: { type: string, enum: [openai-chat, openai-responses, openai-responses-ws, openai-images, anthropic] }
        models:
          type: array
          items: { type: string }
        format_models:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        model_mapping:
          type: object
          additionalProperties: { type: string }
    Template:
      type: object
      required: [ID, Name, BaseURL, SupportedFormats, CreatedAt, UpdatedAt]
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        BaseURL: { type: string }
        CredentialType: { type: string, enum: [api_key, responses-special, codex-oauth, codex-pat], description: 模板号池类型；生态三类型只支持 resp / resp-ws 格式 }
        SupportedFormats:
          type: array
          items: { type: string, enum: [openai-chat, openai-responses, openai-responses-ws, openai-images, anthropic] }
        Models:
          type: array
          items: { type: string }
        FormatModels:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        ModelMapping:
          type: object
          additionalProperties: { type: string }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true, description: 软删除时间戳；null = 存活（列表过滤已删；GET 单个可查已删项） }
    AccountCreate:
      type: object
      required: [name, template_id, upstream_key]
      properties:
        name: { type: string }
        template_id: { type: integer, format: int64 }
        upstream_key: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        weight: { type: integer }
        max_concurrency: { type: integer }
        # 创建时可选：null/缺省 = 无分组；提供 = 替换语义（空数组 = 无分组）
        group_ids:
          type: array
          items: { type: integer, format: int64 }
    Account:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        TemplateID: { type: integer, format: int64 }
        Template: { $ref: '#/components/schemas/Template' }
        UpstreamKey: { type: string }
        Status: { $ref: '#/components/schemas/AccountStatus' }
        CooldownUntil: { type: string, format: date-time, nullable: true }
        Weight: { type: integer }
        MaxConcurrency: { type: integer }
        LastError: { type: string, nullable: true }
        LastUsedAt: { type: string, format: date-time, nullable: true }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true, description: 软删除时间戳；null = 存活（列表过滤已删；GET 单个可查已删项） }
    AccountView:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            concurrency: { type: integer, format: int64 }
            err_rate: { type: number, format: double }
            err_count: { type: integer }
    TemplateExt:
      type: object
      required: [credential_type]
      properties:
        # template_id 只读（响应）；请求体忽略——路径 {id} 为准。
        template_id: { type: integer, format: int64 }
        credential_type: { type: string, enum: [responses-special, codex-oauth, codex-pat], description: "类型声明；必须与父模板 credential_type 一致（不一致 → 400）" }
        # 模板是共享配置面：唯一可配置列 strip_image_tools（三类型公共能力开关）——
        # 凭据列组（oauth/pat）一律在账号级 account_ext（账号私有）。
        strip_image_tools: { type: boolean, nullable: true, description: "三类型公共能力开关：模板级图像 tool 剥离（NULL = 未配置 = 关闭）" }
    AccountExt:
      type: object
      required: [credential_type]
      properties:
        # account_id 只读（响应）；请求体忽略——路径 {id} 为准。
        account_id: { type: integer, format: int64 }
        credential_type: { type: string, enum: [codex-oauth, codex-pat], description: 类型-列组约束（service 校验）：oauth 只允许 oauth_* 列组；pat 只允许 pat_key }
        # 身份四元组（真实 codex 客户端语义；首次写入缺省 → service 自动生成
        # （UUIDv4/v7 形状）并持久化，账号存在期间稳定；显式提供 → 采用；
        # 恒等 thread_id == session_id、window_id = {thread_id}:0）。
        installation_id: { type: string, description: "身份：账号级唯一（UUIDv4；响应恒有——首次写入自动生成）" }
        session_id: { type: string, nullable: true, description: "身份：会话级（UUIDv7；恒等 == thread_id；service 自动生成/沿用）" }
        thread_id: { type: string, nullable: true, description: "身份：会话级（UUIDv7；恒等 == session_id）" }
        window_id: { type: string, nullable: true, description: "身份：会话级派生 {thread_id}:0（导入时生成后恒定不变——恒 0，无透传无解析；上游不校验 n）" }
        # 凭据列组（按 credential_type 约束）
        oauth_token: { type: string, nullable: true, description: 凭据：oauth 访问令牌（oauth 行必填——最小完整性） }
        oauth_refresh_token: { type: string, nullable: true, description: 凭据：oauth 刷新令牌 }
        oauth_expires_at: { type: string, format: date-time, nullable: true, description: 凭据：oauth 访问令牌过期时间 }
        pat_key: { type: string, nullable: true, description: 凭据：pat }
        # 管理标识（非请求面）
        email: { type: string, nullable: true, description: "管理标识：codex 账号登录邮箱（导入时由人工/上游提供，非自动生成——NewCodexIdentity 只生成身份四元组；可空）" }
    TemplateListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Template' }
    AccountListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/AccountView' }
    GroupListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Group' }
    GroupVisibility:
      type: string
      enum: [public, private]
    GroupProtocolConvert:
      type: string
      enum: [off, chat_to_resp, mess_to_resp, resp_to_mess, chat_to_mess]
      default: off
      description: 分组级协议转换（只补差，W5 网关 internal/protoconv 消费）：off = 不转换；chat_to_resp = 客户端 chat → 模板 resp；mess_to_resp = anthropic messages → resp；resp_to_mess = resp → anthropic messages；chat_to_mess = chat → anthropic messages
    GroupAssignmentsBody:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          items: { type: integer, format: int64 }
          description: 替换语义：完整授予列表（未列出即撤销；空数组 = 清空）
        multipliers:
          type: object
          additionalProperties:
            type: number
            format: double
            nullable: true
            minimum: 0
            maximum: 10
          description: 可选：user_id → 该用户在该组的专属价格倍率（正常值，1 = ×1，0 = 免费，上限 10 = ×10；API 边界与万分数换算）。仅对 user_ids 中列出的用户生效；null = 清除为未设置（回退组倍率）；未列出的用户沿用当前值
    GroupAssignmentsResponse:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          items: { type: integer, format: int64 }
        multipliers:
          type: object
          additionalProperties:
            type: number
            format: double
            nullable: true
          description: 该组当前各用户的专属价格倍率（正常值；null/缺省 = 未设置 → 用组倍率）
    UserGroupsBody:
      type: object
      required: [group_ids]
      properties:
        group_ids:
          type: array
          items: { type: integer, format: int64 }
          description: 替换语义：完整授予组列表（未列出即撤销；空数组 = 清空）
        multipliers:
          type: object
          additionalProperties:
            type: number
            format: double
            nullable: true
            minimum: 0
            maximum: 10
          description: 可选：group_id → 该用户在该组的专属价格倍率（正常值，1 = ×1，0 = 免费，上限 10 = ×10；API 边界与万分数换算）。仅对 group_ids 中列出的组生效；null = 清除为未设置（回退组倍率）；未列出的组沿用当前值
    UserGroupsResponse:
      type: object
      required: [group_ids]
      properties:
        group_ids:
          type: array
          items: { type: integer, format: int64 }
        multipliers:
          type: object
          additionalProperties:
            type: number
            format: double
            nullable: true
          description: 该用户当前各授予组的专属价格倍率（正常值；null/缺省 = 未设置 → 用组倍率）
    KeyStatus:
      type: string
      enum: [active, disabled]
    Key:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        UserID: { type: integer, format: int64 }
        GroupID: { type: integer, format: int64 }
        Name: { type: string }
        KeyPrefix: { type: string }
        Status: { $ref: '#/components/schemas/KeyStatus' }
        MaxConcurrency: { type: integer }
        Quota: { type: integer, format: int64, description: 累计 token 上限；0 = 不限 }
        QuotaUsed: { type: integer, format: int64, description: 已消耗（后扣；无额度 key 恒 0） }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true, description: 软删除时间戳；null = 存活（列表/鉴权过滤已删；GET 单个可查已删项） }
    KeyCreate:
      type: object
      required: [name, group_id]
      properties:
        name: { type: string }
        group_id: { type: integer, format: int64 }
        max_concurrency: { type: integer, description: 单 key 在途上限；0 = 不限 }
        quota: { type: integer, format: int64, description: 累计 token 上限；0 = 不限 }
    KeyUpdate:
      type: object
      properties:
        name: { type: string }
        status: { $ref: '#/components/schemas/KeyStatus' }
        max_concurrency: { type: integer }
        quota: { type: integer, format: int64 }
    KeyListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Key' }
    KeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/Key'
        - type: object
          required: [key]
          properties:
            key: { type: string, description: key 明文（创建/轮换响应仅返回一次；之后仅 KeyPrefix 可识别） }
    UserRole:
      type: string
      enum: [platform_admin, user]
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Email: { type: string }
        Role: { $ref: '#/components/schemas/UserRole' }
        Status: { $ref: '#/components/schemas/UserStatus' }
        MaxConcurrency: { type: integer }
        Balance: { type: number, format: double, description: 余额 USD（浮点；内部存储毫分——1 USD = 100,000 毫分，API 边界换算） }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    UserAuthRegister:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    UserAuthLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    UserAuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    UserCreate:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        max_concurrency: { type: integer, description: 用户级在途上限；0 = 不限 }
        balance: { type: number, format: double, description: 余额 USD（浮点，≥ 0；1 USD = 100,000 毫分） }
    UserUpdate:
      type: object
      properties:
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        max_concurrency: { type: integer }
        balance: { type: number, format: double, description: 余额 USD（浮点，≥ 0；1 USD = 100,000 毫分） }
    UserListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/User' }
    Setting:
      type: object
      properties:
        Key: { type: string }
        Type: { type: string, enum: [switch, number, string] }
        Value: { type: string }
        UpdatedAt: { type: string, format: date-time }
    SettingUpdate:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }
    GroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        visibility: { $ref: '#/components/schemas/GroupVisibility' }
        price_multiplier: { type: number, format: double, minimum: 0, maximum: 10, nullable: true, description: 价格倍率（正常值，1 = ×1，0 = 免费，上限 10 = ×10；API 边界与万分数换算——存储 15000 ↔ 显示 1.5）。缺省/null = 不设置（×1）；显式 0 = 免费组；PUT 显式写（含 0） }
        protocol_convert: { $ref: '#/components/schemas/GroupProtocolConvert' }
    RuleCreate:
      type: object
      required: [name, priority]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        priority: { type: integer }
        when:
          type: object
          additionalProperties: true
        then:
          type: object
          additionalProperties: true
    RulePatch:
      type: object
      properties:
        name: { type: string }
        enabled: { type: boolean }
        priority: { type: integer }
        when:
          type: object
          additionalProperties: true
        then:
          type: object
          additionalProperties: true
    Rule:
      type: object
      required: [ID, Name, Enabled, Priority, When, Then, CreatedAt, UpdatedAt]
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        Enabled: { type: boolean }
        Priority: { type: integer }
        When:
          type: object
          additionalProperties: true
        Then:
          type: object
          additionalProperties: true
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true, description: 软删除时间戳；null = 存活（列表/规则引擎重载过滤已删；GET 单个可查已删项） }
    RuleListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Rule' }
    Group:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        Visibility: { $ref: '#/components/schemas/GroupVisibility' }
        PriceMultiplier: { type: number, format: double, description: 价格倍率（正常值，1 = ×1，0 = 免费，上限 10 = ×10；API 边界与万分数换算——存储 15000 ↔ 显示 1.5） }
        ProtocolConvert: { $ref: '#/components/schemas/GroupProtocolConvert' }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true, description: 软删除时间戳；null = 存活（列表/消费路径过滤已删；GET 单个可查已删项） }
    AccountGroupsResponse:
      type: object
      required: [group_ids]
      properties:
        group_ids:
          type: array
          items: { type: integer, format: int64 }
    BatchDeleteBody:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
    BatchUpdateTemplatesBody:
      type: object
      required: [ids, fields]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
        fields:
          $ref: '#/components/schemas/TemplatePatch'
    TemplatePatch:
      type: object
      properties:
        name: { type: string }
        base_url: { type: string }
        supported_formats:
          type: array
          minItems: 1
          items: { type: string, enum: [openai-chat, openai-responses, openai-responses-ws, openai-images, anthropic] }
        models:
          type: array
          items: { type: string }
        format_models:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        model_mapping:
          type: object
          additionalProperties: { type: string }
    AccountPatch:
      type: object
      properties:
        name: { type: string }
        template_id: { type: integer, format: int64 }
        upstream_key: { type: string }
        status: { type: string, enum: [active, unhealthy, "429", disabled] }
        weight: { type: integer }
        max_concurrency: { type: integer }
        # 替换语义：null/缺省 = 不变；[] = 清空；提供列表 = 替换账号全部分组
        group_ids:
          type: array
          items: { type: integer, format: int64 }
    GroupPatch:
      type: object
      properties:
        name: { type: string }
        visibility: { $ref: '#/components/schemas/GroupVisibility' }
    BatchUpdateAccountsBody:
      type: object
      required: [ids, fields]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
        fields: { $ref: '#/components/schemas/AccountPatch' }
    BatchUpdateGroupsBody:
      type: object
      required: [ids, fields]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
        fields: { $ref: '#/components/schemas/GroupPatch' }
    BatchDeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer }
    BatchUpdateResponse:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }
    # --- 兑换码（Phase 5 计费前基础设施：资源发放的通用载体） ---
    RedemptionType:
      type: string
      enum: [balance, concurrency, temp_balance]
    RedemptionStatus:
      type: string
      enum: [active, disabled]
    RedemptionCode:
      type: object
      required: [ID, Code, Type, Value, MaxUses, UsedCount, Status, CreatedBy, CreatedAt, UpdatedAt]
      properties:
        ID: { type: integer, format: int64 }
        Code: { type: string, description: XXXX-XXXX-XXXX-XXXX（16 字符，生成后不可编辑，仅可失效） }
        Type: { $ref: '#/components/schemas/RedemptionType' }
        Value: { type: number, format: double, description: 面值：balance/temp_balance = USD（1 = $1）；concurrency = 并发数（整数）。存储毫分（API 边界换算） }
        Remark: { type: string, nullable: true }
        ExpiresAt: { type: string, format: date-time, nullable: true, description: 码未兑换即过期；null = 永久 }
        ResourceExpiresAt: { type: string, format: date-time, nullable: true, description: 兑换后资源到期；temp_balance 必有，其余恒 null }
        MaxUses: { type: integer, description: 1 = 单次码；>1 = 多人码 }
        UsedCount: { type: integer, description: 已兑换次数 }
        Status: { $ref: '#/components/schemas/RedemptionStatus' }
        CreatedBy: { type: integer, format: int64, description: 0 = 系统（静态 admin token）；>0 = platform_admin 用户 id }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    RedemptionUse:
      type: object
      required: [ID, CodeID, UserID, Value, CreatedAt]
      properties:
        ID: { type: integer, format: int64 }
        CodeID: { type: integer, format: int64 }
        UserID: { type: integer, format: int64 }
        Value: { type: number, format: double, description: 兑换时的值快照（同面值单位语义） }
        ResourceExpiresAt: { type: string, format: date-time, nullable: true }
        CreatedAt: { type: string, format: date-time }
    RedemptionRecord:
      type: object
      required: [ID, CodeID, Code, CodeType, Value, CreatedAt]
      properties:
        ID: { type: integer, format: int64 }
        CodeID: { type: integer, format: int64 }
        Code: { type: string }
        CodeType: { $ref: '#/components/schemas/RedemptionType' }
        Value: { type: number, format: double, description: 兑换时的值快照（同面值单位语义） }
        Remark: { type: string, nullable: true }
        ResourceExpiresAt: { type: string, format: date-time, nullable: true }
        CreatedAt: { type: string, format: date-time }
    RedemptionCodeListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/RedemptionCode' }
    RedemptionUseListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/RedemptionUse' }
    RedemptionRecordListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/RedemptionRecord' }
    GenerateRequest:
      type: object
      required: [type, value]
      properties:
        type: { $ref: '#/components/schemas/RedemptionType' }
        value: { type: number, format: double, description: 面值：balance/temp_balance = USD；concurrency = 并发数（整数）。> 0 }
        remark: { type: string }
        expires_at: { type: string, format: date-time, description: 码未兑换即过期；缺省 = 永久 }
        resource_expires_at: { type: string, format: date-time, description: 兑换后资源到期；temp_balance 必填（决策 4） }
        max_uses: { type: integer, description: 1 = 单次码（缺省）；>1 = 多人码 }
        count: { type: integer, description: 生成个数 1-1000（缺省 1） }
    GenerateResponse:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { $ref: '#/components/schemas/RedemptionCode' }
    DeactivateRequest:
      type: object
      description: 单码失效无请求体（保留空 schema 对齐批量端点命名）
    DeactivateResponse:
      type: object
      required: [deactivated]
      properties:
        deactivated: { type: boolean }
    BatchDeactivateRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
    BatchDeactivateResponse:
      type: object
      required: [deactivated]
      properties:
        deactivated: { type: integer, description: 新失效数（已 disabled no-op 不计） }
    # --- litellm 模型价格（Phase 5 计费价格来源） ---
    PricingSource:
      type: string
      enum: [litellm, manual]
    Pricing:
      type: object
      required: [Model, PromptPricePerMillion, CompletionPricePerMillion, Source, CreatedAt, UpdatedAt]
      properties:
        Model: { type: string }
        PromptPricePerMillion: { type: number, format: double, description: USD/1M tokens（API 边界换算；内部存储毫分——1 USD = 100,000 毫分） }
        CompletionPricePerMillion: { type: number, format: double, description: USD/1M tokens（API 边界换算；内部存储毫分——1 USD = 100,000 毫分） }
        MaxInputTokens: { type: integer, format: int64, nullable: true, description: litellm 自带上下文窗口；nil = 未知 }
        MaxOutputTokens: { type: integer, format: int64, nullable: true }
        CacheReadPricePerMillion: { type: number, format: double, nullable: true, description: 缓存读取价（litellm cache_read_input_token_cost 换算）；nil = 无缓存价 }
        CacheCreationPricePerMillion: { type: number, format: double, nullable: true, description: 缓存写入价（litellm cache_creation_input_token_cost 换算）；nil = 无缓存价 }
        PriorityPromptPricePerMillion: { type: number, format: double, nullable: true, description: service_tier=priority 单价替换档（OpenAI 专属：gpt-5 系列 priority 价；USD/1M tokens，内部存储毫分——1 USD = 100,000 毫分，API 边界换算）；nil = 无该档价，计费回退基础价 }
        PriorityCompletionPricePerMillion: { type: number, format: double, nullable: true }
        PriorityCacheReadPricePerMillion: { type: number, format: double, nullable: true }
        PriorityCacheCreationPricePerMillion: { type: number, format: double, nullable: true }
        FlexPromptPricePerMillion: { type: number, format: double, nullable: true, description: service_tier=flex 单价替换档（OpenAI 专属：gpt-5.6-sol flex 价；USD/1M tokens，内部存储毫分——1 USD = 100,000 毫分，API 边界换算）；nil = 无该档价，计费回退基础价 }
        FlexCompletionPricePerMillion: { type: number, format: double, nullable: true }
        FlexCacheReadPricePerMillion: { type: number, format: double, nullable: true }
        FlexCacheCreationPricePerMillion: { type: number, format: double, nullable: true }
        FastMultiplier: { type: number, format: double, nullable: true, description: Anthropic 专属（claude 系列 Fast Mode 整单倍率，正常值 2.0 = ×2.0；fast 挡计费 = 基础价 × 此倍率；API 边界换算）；nil = 无倍率 }
        AboveThreshold: { type: integer, format: int64, nullable: true, description: 上下文分段阈值（tokens）；nil = 无分段 }
        AbovePromptPricePerMillion: { type: number, format: double, nullable: true, description: 超阈值分段价（基础组，USD/1M tokens（API 边界换算；内部存储毫分——1 USD = 100,000 毫分））；nil = 该分量不拆段 }
        AboveCompletionPricePerMillion: { type: number, format: double, nullable: true }
        AboveCacheReadPricePerMillion: { type: number, format: double, nullable: true }
        AboveCacheCreationPricePerMillion: { type: number, format: double, nullable: true }
        AbovePriorityPromptPricePerMillion: { type: number, format: double, nullable: true, description: 超阈值分段价（priority 组，azure 形态）；nil = 该档回退基础 above 组 }
        AbovePriorityCompletionPricePerMillion: { type: number, format: double, nullable: true }
        AbovePriorityCacheReadPricePerMillion: { type: number, format: double, nullable: true }
        AbovePriorityCacheCreationPricePerMillion: { type: number, format: double, nullable: true }
        AboveFlexPromptPricePerMillion: { type: number, format: double, nullable: true, description: 超阈值分段价（flex 组，gpt-5.6-sol 形态）；nil = 该档回退基础 above 组 }
        AboveFlexCompletionPricePerMillion: { type: number, format: double, nullable: true }
        AboveFlexCacheReadPricePerMillion: { type: number, format: double, nullable: true }
        AboveFlexCacheCreationPricePerMillion: { type: number, format: double, nullable: true }
        Provider: { type: string, nullable: true, description: litellm_provider（litellm 行才有；manual 行 nil） }
        Mode: { type: string, nullable: true, description: litellm mode（chat/completion/embedding 等） }
        SupportsPromptCaching: { type: boolean, nullable: true, description: litellm supports_prompt_caching }
        Source: { $ref: '#/components/schemas/PricingSource' }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    PricingUpsert:
      type: object
      required: [prompt_price_per_million, completion_price_per_million]
      properties:
        prompt_price_per_million: { type: number, format: double, minimum: 0, description: USD/1M tokens（API 边界换算；内部存储毫分——1 USD = 100,000 毫分）；≥ 0 }
        completion_price_per_million: { type: number, format: double, minimum: 0 }
        cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: 缓存读取价（USD/1M tokens；内部存储毫分——1 USD = 100,000 毫分，API 边界换算）；缺省 = 不设缓存价（落库 NULL） }
        cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: 缓存写入价；缺省 = 不设缓存价（落库 NULL） }
        priority_prompt_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: service_tier=priority 单价替换档（OpenAI 专属：gpt-5 系列 priority 价；USD/1M tokens，内部存储毫分——1 USD = 100,000 毫分，API 边界换算）；缺省/null = 不设（落库 NULL，计费回退基础价） }
        priority_completion_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        priority_cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        priority_cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        flex_prompt_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: service_tier=flex 单价替换档（OpenAI 专属：gpt-5.6-sol flex 价；USD/1M tokens，内部存储毫分——1 USD = 100,000 毫分，API 边界换算）；缺省/null = 不设（落库 NULL，计费回退基础价） }
        flex_completion_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        flex_cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        flex_cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        fast_multiplier: { type: number, format: double, minimum: 0, maximum: 10, nullable: true, description: Anthropic 专属（claude 系列 Fast Mode 整单倍率，正常值 0 < m ≤ 10，2.0 = ×2.0；fast 挡计费 = 基础价 × 此倍率；API 边界换算）；缺省/null = 不设 }
        above_threshold: { type: integer, format: int64, minimum: 0, nullable: true, description: 上下文分段阈值（tokens）；缺省/null = 不设（无分段） }
        above_prompt_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: 超阈值分段价（基础组，USD/1M tokens（API 边界换算；内部存储毫分——1 USD = 100,000 毫分））；缺省/null = 该分量不拆段 }
        above_completion_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_priority_prompt_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: 超阈值分段价（priority 组，azure 形态）；缺省/null = 该档回退基础 above 组 }
        above_priority_completion_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_priority_cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_priority_cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_flex_prompt_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: 超阈值分段价（flex 组，gpt-5.6-sol 形态）；缺省/null = 该档回退基础 above 组 }
        above_flex_completion_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_flex_cache_read_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
        above_flex_cache_creation_price_per_million: { type: number, format: double, minimum: 0, nullable: true }
    PricingListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Pricing' }
    PricingSyncResponse:
      type: object
      required: [rows, skipped, updated]
      properties:
        rows: { type: integer, description: 拉取到的有效模型行数 }
        skipped: { type: integer, description: 解析时跳过的非法条目数（文本价、image 价与 function 价均无效，计一次） }
        updated: { type: integer, description: 文本价 upsert 落库数（manual 行不计） }
        image_rows: { type: integer, description: 拉取到的有效 image 价行数（Task A 双线） }
        image_updated: { type: integer, description: image 价 upsert 落库数（manual 行不计） }
        function_rows: { type: integer, description: 拉取到的有效按单元价行数（价格表三件套） }
        function_updated: { type: integer, description: 按单元价 upsert 落库数（manual 行不计） }
    ImagePrice:
      type: object
      required: [Model, Source, CreatedAt, UpdatedAt]
      properties:
        Model: { type: string, description: 模型名（与 pricings.model 同口径） }
        InputImageTokenPricePerMillion: { type: number, format: double, nullable: true, description: image token 输入价（USD per 1M image tokens——per-million 口径，与 pricings 字段语义一致；内部存储毫分/1M，×1e5 换算，1 USD = 100,000 毫分）；null = 无该分量价 }
        OutputImageTokenPricePerMillion: { type: number, format: double, nullable: true, description: image token 输出价（USD per 1M image tokens——per-million 口径，与 pricings 字段语义一致；内部存储毫分/1M，×1e5 换算）；null = 无该分量价 }
        OutputCostPerImage: { type: number, format: double, nullable: true, description: 每张图价（USD/张；内部存储毫分——×1e5 换算，与 token 价同系数但单位语义不同：按张 flat，计费不走 /1e6 除法）；null = 不启用按张分量 }
        Source: { $ref: '#/components/schemas/PricingSource' }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    ImagePriceUpsert:
      type: object
      properties:
        input_image_token_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: image token 输入价（USD per 1M image tokens——per-million 口径，与 pricings 字段语义一致；API 边界 ×1e5 → 毫分/1M）；缺省/null = 清空该分量 }
        output_image_token_price_per_million: { type: number, format: double, minimum: 0, nullable: true, description: image token 输出价（USD per 1M image tokens——per-million 口径，与 pricings 字段语义一致；API 边界 ×1e5 → 毫分/1M）；缺省/null = 清空该分量 }
        output_cost_per_image: { type: number, format: double, minimum: 0, nullable: true, description: 每张图价（USD/张；API 边界 ×1e5 → 毫分/张——与 token 价同系数但单位语义独立：按张 flat，不走 /1e6 除法）；缺省/null = 清空该分量 }
    ImagePriceListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ImagePrice' }
    FunctionPrice:
      type: object
      required: [Model, Source, CreatedAt, UpdatedAt]
      properties:
        Model: { type: string, description: 模型/功能标识（litellm search 模型名 或 codex-search 固定标识） }
        PricePerCall: { type: number, format: double, nullable: true, description: 按单元价（USD/次——litellm 原生口径 input_cost_per_query；内部存储毫分/次，×1e5 换算，1 USD = 100,000 毫分，**与 token 价不同换算系**，计费不走 /1e6 除法）；null = 无按单元价 }
        Source: { $ref: '#/components/schemas/PricingSource' }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    FunctionPriceUpsert:
      type: object
      properties:
        price_per_call: { type: number, format: double, minimum: 0, nullable: true, description: 按单元价（USD/次；API 边界 ×1e5 → 毫分/次）；必填且 ≥0——缺省/null → 400（service 行有效性校验：按单元价非 nil；0 = 按次免费） }
    FunctionPriceListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/FunctionPrice' }
    RedeemRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    RedeemResponse:
      type: object
      required: [applied]
      properties:
        applied:
          type: object
          required: [type, value]
          properties:
            type: { $ref: '#/components/schemas/RedemptionType' }
            value: { type: number, format: double, description: 兑换时的值快照（同面值单位语义） }
            resource_expires_at: { type: string, format: date-time, nullable: true }
    UsageLog:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        RequestID: { type: string }
        GroupID: { type: integer, format: int64 }
        AccountID: { type: integer, format: int64 }
        TemplateID: { type: integer, format: int64 }
        UserID: { type: integer, format: int64, description: 鉴权归属用户；0 = 无 }
        KeyID: { type: integer, format: int64, description: 鉴权归属 key；0 = 无 }
        Model: { type: string }
        MappedModel: { type: string, nullable: true }
        Format: { $ref: '#/components/schemas/RequestFormat' }
        # 用户裁决（err_logs 分表）：status_code/error_message 已移入 err_logs
        #（usage_logs 瘦身 + 纯计费化），本响应不再含该两字段。
        ErrorType: { $ref: '#/components/schemas/ErrorType' }
        LatencyMS: { type: integer, format: int64 }
        TTFTMS: { type: integer, format: int64, nullable: true, description: 首 token 时间毫秒（流式首 chunk 采集）；非流式/失败/无首 token 路径 = null }
        InputTokens: { type: integer, format: int64 }
        PriceInputMillis: { type: integer, format: int64, nullable: true, description: 输入单价快照（每 M token 毫分，1 USD = 100,000 毫分；pricing 同款单位）；null = 未计费路径 }
        OutputTokens: { type: integer, format: int64 }
        PriceOutputMillis: { type: integer, format: int64, nullable: true, description: 输出单价快照（每 M token 毫分）；null = 未计费路径 }
        TotalTokens: { type: integer, format: int64 }
        CacheReadTokens: { type: integer, format: int64 }
        PriceCacheReadMillis: { type: integer, format: int64, nullable: true, description: 缓存读单价快照（每 M token 毫分）；null = 该请求无缓存读或无缓存价 }
        CacheCreationTokens: { type: integer, format: int64 }
        PriceCacheCreationMillis: { type: integer, format: int64, nullable: true, description: 缓存写单价快照（每 M token 毫分）；null = 该请求无缓存写或无缓存价 }
        Cost: { type: integer, format: int64, description: 计费成本（毫分，1 USD = 100,000 毫分）；错误请求（402/4xx）为 0 }
        BillingTier: { type: string, description: 请求 service_tier 归一化值（priority/flex/fast/auto）；空 = 未计费路径 }
        AboveHit: { type: boolean, description: 任一分量超 above 阈值命中分段 }
        Overdraft: { type: boolean, description: 本次扣费透支（余额不足扣为负余额） }
        CreatedAt: { type: string, format: date-time }
    LogsResponse:
      type: object
      required: [rows, next_cursor]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/UsageLog' }
        next_cursor: { type: integer, format: int64, nullable: true, description: 下一页游标（本页最后一条 id）；null = 无更多行 }
    ErrLog:
      type: object
      description: 错误明细审计（err_logs 瘦表：拒绝 + 异常双轨；无 token/价格列）
      properties:
        ID: { type: integer, format: int64 }
        RequestID: { type: string }
        GroupID: { type: integer, format: int64 }
        AccountID: { type: integer, format: int64 }
        TemplateID: { type: integer, format: int64 }
        UserID: { type: integer, format: int64, description: 鉴权归属用户；0 = 无 }
        KeyID: { type: integer, format: int64, description: 鉴权归属 key；0 = 无 }
        Model: { type: string }
        Format: { $ref: '#/components/schemas/RequestFormat' }
        StatusCode: { type: integer, description: 错误状态码（完整错误面；0 = 连接级） }
        ErrorType: { $ref: '#/components/schemas/ErrorType' }
        ErrorMessage: { type: string, nullable: true, description: 错误文本（拒绝文案/上游 body，域内截断 500 字符）；null = 无错误文本 }
        LatencyMS: { type: integer, format: int64 }
        BillingTier: { type: string, nullable: true, description: 计费档位（service_tier 归一化：priority/flex/fast/auto）；null = 未计费路径 }
        CreatedAt: { type: string, format: date-time }
    ErrLogsResponse:
      type: object
      required: [rows, next_cursor]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/ErrLog' }
