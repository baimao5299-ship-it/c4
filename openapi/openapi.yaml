openapi: 3.0.3
info:
  title: github.com/is7qin/c3api Admin API
  version: 1.0.0
  description: '管理端 API（模板/账号/分组/规则/日志/统计）。认证：Authorization: Bearer <admin_token>。'
servers:
  - url: /admin
tags:
  - name: templates
  - name: accounts
  - name: groups
  - name: users
  - name: rules
  - name: logs
  - name: stats
  - name: redemptions
  - name: pricing
paths:
  /templates:
    post:
      operationId: PostTemplates
      tags: [templates]
      summary: 创建模板
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '200':
          description: 创建后的模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetTemplates
      tags: [templates]
      summary: 模板列表（分页/筛选/排序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/batch-delete:
    post:
      operationId: PostTemplatesBatchDelete
      tags: [templates]
      summary: 批量删除模板（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/batch-update:
    post:
      operationId: PostTemplatesBatchUpdate
      tags: [templates]
      summary: 批量更新模板（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateTemplatesBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetTemplatesId
      tags: [templates]
      responses:
        '200':
          description: 模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutTemplatesId
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '200':
          description: 更新后模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteTemplatesId
      tags: [templates]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/{id}/ext:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetTemplatesIdExt
      tags: [templates]
      summary: 读取模板类型化扩展（编辑回显；仅生态三类型模板有 ext 行）
      responses:
        '200':
          description: 模板 ext 配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateExt' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutTemplatesIdExt
      tags: [templates]
      summary: 幂等写入模板类型化扩展（Create/Update 合一；全列更新含 NULL 清空）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateExt' }
      responses:
        '200':
          description: 写入后的 ext 配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateExt' }
        default:
          $ref: '#/components/responses/Error'
  /accounts:
    post:
      operationId: PostAccounts
      tags: [accounts]
      summary: 创建账号
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '200':
          description: 创建后的账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetAccounts
      tags: [accounts]
      summary: 账号列表（分页/筛选/排序，含运行时视图）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: status, in: query, schema: { type: string, description: 多值逗号分隔：active,unhealthy,429,disabled } }
        - { name: template_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 账号视图列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/batch-delete:
    post:
      operationId: PostAccountsBatchDelete
      tags: [accounts]
      summary: 批量删除账号（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/batch-update:
    post:
      operationId: PostAccountsBatchUpdate
      tags: [accounts]
      summary: 批量更新账号（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateAccountsBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetAccountsId
      tags: [accounts]
      responses:
        '200':
          description: 账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutAccountsId
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '200':
          description: 更新后账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteAccountsId
      tags: [accounts]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/groups:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetAccountsIdGroups
      tags: [accounts]
      summary: 读取账号的全部分组 id（编辑回显；不随账号列表返回）
      responses:
        '200':
          description: 分组 id 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountGroupsResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/ext:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetAccountsIdExt
      tags: [accounts]
      summary: 读取账号类型化鉴权扩展（编辑回显；仅 codex-oauth/codex-pat 账号有 ext 行）
      responses:
        '200':
          description: 账号 ext 配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExt' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutAccountsIdExt
      tags: [accounts]
      summary: 幂等写入账号类型化鉴权扩展（Create/Update 合一；全列更新含 NULL 清空）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountExt' }
      responses:
        '200':
          description: 写入后的 ext 配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExt' }
        default:
          $ref: '#/components/responses/Error'
  /groups:
    post:
      operationId: PostGroups
      tags: [groups]
      summary: 创建分组（平台容量池；key 为独立表，由用户面 /user/keys 创建）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '200':
          description: 创建后的分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetGroups
      tags: [groups]
      summary: 分组列表（分页/筛选/排序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 分组列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/batch-delete:
    post:
      operationId: PostGroupsBatchDelete
      tags: [groups]
      summary: 批量删除分组（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/batch-update:
    post:
      operationId: PostGroupsBatchUpdate
      tags: [groups]
      summary: 批量更新分组（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateGroupsBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetGroupsId
      tags: [groups]
      responses:
        '200':
          description: 分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutGroupsId
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '200':
          description: 更新后分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteGroupsId
      tags: [groups]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /users:
    get:
      operationId: GetUsers
      tags: [users]
      summary: 用户列表（platform_admin 专属；分页/筛选/排序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: email, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: PostUsers
      tags: [users]
      summary: 创建用户（platform_admin 专属；email 唯一/格式、密码 ≤72 字节）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '200':
          description: 创建后的用户（PasswordHash 永不下发）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: PutUsersId
      tags: [users]
      summary: 更新用户（role/status/max_concurrency/balance；变更即时生效——Auth 快照刷新）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  /users/{id}/groups:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetUsersIdGroups
      tags: [users]
      summary: 读取用户被授予的分组与各专属倍率（platform_admin；用户视角，与 /groups/{id}/assignments 对称）
      responses:
        '200':
          description: 该用户被授予的组 id 列表与各专属倍率
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserGroupsResponse' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutUsersIdGroups
      tags: [users]
      summary: 设置用户的授予分组（platform_admin；替换语义：未列出即撤销，空数组 = 清空）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserGroupsBody' }
      responses:
        '200':
          description: 已生效的授予组 id 列表与专属倍率
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserGroupsResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/{id}/assignments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetGroupsIdAssignments
      tags: [groups]
      summary: 读取组的授予用户与专属倍率（platform_admin；与 PUT 对称，供前端预填充与安全全量写回）
      responses:
        '200':
          description: 该组当前的授予 user_id 列表与专属倍率
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAssignmentsResponse' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutGroupsIdAssignments
      tags: [groups]
      summary: 设置组的授予用户（platform_admin；替换语义：未列出即撤销，空数组 = 清空）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupAssignmentsBody' }
      responses:
        '200':
          description: 已生效的授予 user_id 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAssignmentsResponse' }
        default:
          $ref: '#/components/responses/Error'
  /settings:
    get:
      operationId: GetAdminSettings
      tags: [settings]
      summary: 全部设置（默认值 + DB 覆盖）
      responses:
        '200':
          description: 设置列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Setting' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutAdminSettings
      tags: [settings]
      summary: 更新设置（类型化校验：switch 必须 true/false、number 必须数字）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingUpdate' }
      responses:
        '200':
          description: 更新后的设置列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Setting' }
        default:
          $ref: '#/components/responses/Error'
  # --- 兑换码（tag: redemptions；Phase 5 计费前基础设施——资源发放的通用载体） ---
  # 注意 chi 路径顺序：/redemption-codes/batch-deactivate 必须先于
  # /redemption-codes/{id}/... 注册（生成器按 spec 顺序注册，防 "batch-deactivate"
  # 被 {id} 捕获，对齐 /templates/batch-delete 先例）。
  /redemption-codes:
    post:
      operationId: PostRedemptionCodes
      tags: [redemptions]
      summary: 生成兑换码（1..count 个；count 默认 1，上限 1000；type 枚举/value>0/temp_balance 必填 resource_expires_at）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '200':
          description: 生成的完整码列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateResponse' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetRedemptionCodes
      tags: [redemptions]
      summary: 兑换码列表（增强分页范式 page/page_size；type/status 筛选；sort 白名单）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1, description: 页码（1-based） } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 1000 } }
        - { name: type, in: query, schema: { type: string, enum: [balance, concurrency, temp_balance] } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 兑换码列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedemptionCodeListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /redemption-codes/batch-deactivate:
    post:
      operationId: PostRedemptionCodesBatchDeactivate
      tags: [redemptions]
      summary: 批量失效兑换码（单事务；已失效 no-op；缺失 id → 404 含缺失详情）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeactivateRequest' }
      responses:
        '200':
          description: 新失效数（已 disabled 不计）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeactivateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /redemption-codes/{id}/uses:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetRedemptionCodesIdUses
      tags: [redemptions]
      summary: 某码的兑换记录（审计；码缺失 → 404）
      responses:
        '200':
          description: 兑换记录列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedemptionUseListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /redemption-codes/{id}/deactivate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: PostRedemptionCodesIdDeactivate
      tags: [redemptions]
      summary: 单码失效（已失效 no-op；缺失 → 404）
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeactivateRequest' }
      responses:
        '200':
          description: 失效成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeactivateResponse' }
        default:
          $ref: '#/components/responses/Error'
  # --- litellm 模型价格（tag: pricing；Phase 5 计费价格来源） ---
  # 注意 chi 路径顺序：/pricing/sync 必须先于 /pricing/{model} 注册（生成器按
  # spec 顺序注册，防 "sync" 被 {model} 捕获，对齐 /redemption-codes/batch-deactivate 先例）。
  /pricing:
    get:
      operationId: GetPricing
      tags: [pricing]
      summary: 模型价格列表（分页/筛选/排序；sort 白名单 model/updated_at）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1, description: 页码（1-based） } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 1000 } }
