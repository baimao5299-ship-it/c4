openapi: 3.0.3
info:
  title: go-proxy-mini Admin API
  version: 1.0.0
  description: '管理端 API（模板/账号/分组/规则/日志/统计）。认证：Authorization: Bearer <admin_token>。'
servers:
  - url: /admin
tags:
  - name: templates
  - name: accounts
  - name: groups
  - name: users
  - name: rules
  - name: logs
  - name: stats
  - name: redemptions
  - name: pricing
paths:
  /templates:
    post:
      operationId: PostTemplates
      tags: [templates]
      summary: 创建模板
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '200':
          description: 创建后的模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetTemplates
      tags: [templates]
      summary: 模板列表（分页/筛选/排序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/batch-delete:
    post:
      operationId: PostTemplatesBatchDelete
      tags: [templates]
      summary: 批量删除模板（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/batch-update:
    post:
      operationId: PostTemplatesBatchUpdate
      tags: [templates]
      summary: 批量更新模板（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateTemplatesBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetTemplatesId
      tags: [templates]
      responses:
        '200':
          description: 模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutTemplatesId
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '200':
          description: 更新后模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteTemplatesId
      tags: [templates]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts:
    post:
      operationId: PostAccounts
      tags: [accounts]
      summary: 创建账号
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '200':
          description: 创建后的账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetAccounts
      tags: [accounts]
      summary: 账号列表（分页/筛选/排序，含运行时视图）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: status, in: query, schema: { type: string, description: 多值逗号分隔：active,unhealthy,429,disabled } }
        - { name: template_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 账号视图列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/batch-delete:
    post:
      operationId: PostAccountsBatchDelete
      tags: [accounts]
      summary: 批量删除账号（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/batch-update:
    post:
      operationId: PostAccountsBatchUpdate
      tags: [accounts]
      summary: 批量更新账号（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateAccountsBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetAccountsId
      tags: [accounts]
      responses:
        '200':
          description: 账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutAccountsId
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '200':
          description: 更新后账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteAccountsId
      tags: [accounts]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/groups:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetAccountsIdGroups
      tags: [accounts]
      summary: 读取账号的全部分组 id（编辑回显；不随账号列表返回）
      responses:
        '200':
          description: 分组 id 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountGroupsResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups:
    post:
      operationId: PostGroups
      tags: [groups]
      summary: 创建分组（平台容量池；key 为独立表，由用户面 /user/keys 创建）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '200':
          description: 创建后的分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetGroups
      tags: [groups]
      summary: 分组列表（分页/筛选/排序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 分组列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/batch-delete:
    post:
      operationId: PostGroupsBatchDelete
      tags: [groups]
      summary: 批量删除分组（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/batch-update:
    post:
      operationId: PostGroupsBatchUpdate
      tags: [groups]
      summary: 批量更新分组（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateGroupsBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetGroupsId
      tags: [groups]
      responses:
        '200':
          description: 分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutGroupsId
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '200':
          description: 更新后分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteGroupsId
      tags: [groups]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /users:
    get:
      operationId: GetUsers
      tags: [users]
      summary: 用户列表（platform_admin 专属；分页/筛选/排序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: email, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: PostUsers
      tags: [users]
      summary: 创建用户（platform_admin 专属；email 唯一/格式、密码 ≤72 字节）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '200':
          description: 创建后的用户（PasswordHash 永不下发）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: PutUsersId
      tags: [users]
      summary: 更新用户（role/status/max_concurrency/balance；变更即时生效——Auth 快照刷新）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  /groups/{id}/assignments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: PutGroupsIdAssignments
      tags: [groups]
      summary: 设置组的授予用户（platform_admin；替换语义：未列出即撤销，空数组 = 清空）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupAssignmentsBody' }
      responses:
        '200':
          description: 已生效的授予 user_id 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAssignmentsResponse' }
        default:
          $ref: '#/components/responses/Error'
  /settings:
    get:
      operationId: GetAdminSettings
      tags: [settings]
      summary: 全部设置（默认值 + DB 覆盖）
      responses:
        '200':
          description: 设置列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Setting' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutAdminSettings
      tags: [settings]
      summary: 更新设置（类型化校验：switch 必须 true/false、number 必须数字）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingUpdate' }
      responses:
        '200':
          description: 更新后的设置列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Setting' }
        default:
          $ref: '#/components/responses/Error'
  # --- 兑换码（tag: redemptions；Phase 5 计费前基础设施——资源发放的通用载体） ---
  # 注意 chi 路径顺序：/redemption-codes/batch-deactivate 必须先于
  # /redemption-codes/{id}/... 注册（生成器按 spec 顺序注册，防 "batch-deactivate"
  # 被 {id} 捕获，对齐 /templates/batch-delete 先例）。
  /redemption-codes:
    post:
      operationId: PostRedemptionCodes
      tags: [redemptions]
      summary: 生成兑换码（1..count 个；count 默认 1，上限 1000；type 枚举/value>0/temp_balance 必填 resource_expires_at）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '200':
          description: 生成的完整码列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateResponse' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetRedemptionCodes
      tags: [redemptions]
      summary: 兑换码列表（增强分页范式 page/page_size；type/status 筛选；sort 白名单）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1, description: 页码（1-based） } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 1000 } }
        - { name: type, in: query, schema: { type: string, enum: [balance, concurrency, temp_balance] } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 兑换码列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedemptionCodeListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /redemption-codes/batch-deactivate:
    post:
      operationId: PostRedemptionCodesBatchDeactivate
      tags: [redemptions]
      summary: 批量失效兑换码（单事务；已失效 no-op；缺失 id → 404 含缺失详情）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeactivateRequest' }
      responses:
        '200':
          description: 新失效数（已 disabled 不计）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeactivateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /redemption-codes/{id}/uses:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetRedemptionCodesIdUses
      tags: [redemptions]
      summary: 某码的兑换记录（审计；码缺失 → 404）
      responses:
        '200':
          description: 兑换记录列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedemptionUseListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /redemption-codes/{id}/deactivate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: PostRedemptionCodesIdDeactivate
      tags: [redemptions]
      summary: 单码失效（已失效 no-op；缺失 → 404）
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeactivateRequest' }
      responses:
        '200':
          description: 失效成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeactivateResponse' }
        default:
          $ref: '#/components/responses/Error'
  # --- litellm 模型价格（tag: pricing；Phase 5 计费价格来源） ---
  # 注意 chi 路径顺序：/pricing/sync 必须先于 /pricing/{model} 注册（生成器按
  # spec 顺序注册，防 "sync" 被 {model} 捕获，对齐 /redemption-codes/batch-deactivate 先例）。
  /pricing:
    get:
      operationId: GetPricing
      tags: [pricing]
      summary: 模型价格列表（分页/筛选/排序；sort 白名单 model/updated_at）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1, description: 页码（1-based） } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 1000 } }
        - { name: source, in: query, schema: { type: string, enum: [litellm, manual] } }
        - { name: model, in: query, schema: { type: string, description: 模型名模糊搜索（大小写不敏感） } }
        - { name: sort, in: query, schema: { type: string, description: sort 白名单：model/updated_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 价格列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /pricing/sync:
    post:
      operationId: PostPricingSync
      tags: [pricing]
      summary: 手动触发一次价格同步（fetch 官方价格表 → upsert → 快照重载；失败保留旧价）
      responses:
        '200':
          description: 拉取统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingSyncResponse' }
        default:
          $ref: '#/components/responses/Error'
  /pricing/{model}:
    parameters:
      - { name: model, in: path, required: true, schema: { type: string, description: 模型名 } }
    put:
      operationId: PutPricingModel
      tags: [pricing]
      summary: 手动设价（毫分/1M tokens；upsert 强制 source=manual，可接管 litellm 行）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingUpsert' }
      responses:
        '200':
          description: 设价后的价格行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pricing' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeletePricingModel
      tags: [pricing]
      summary: 删除手动价（litellm 行 → 409；不存在 → 404；删除后下轮拉取补回）
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  # --- /user 面（tag: user；生成到 internal/handler/user 独立 ServerInterface） ---
  /user/auth/register:
    post:
      operationId: PostUserAuthRegister
      tags: [user]
      summary: 注册（signup_enabled 开关检查；注册即登录返回 JWT）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAuthRegister' }
      responses:
        '200':
          description: JWT + 用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAuthResponse' }
        default:
          $ref: '#/components/responses/Error'
  /user/auth/login:
    post:
      operationId: PostUserAuthLogin
      tags: [user]
      summary: 登录（bcrypt 校验 → JWT）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAuthLogin' }
      responses:
        '200':
          description: JWT + 用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAuthResponse' }
        default:
          $ref: '#/components/responses/Error'
  /user/auth/me:
    get:
      operationId: GetUserAuthMe
      tags: [user]
      summary: 当前用户信息（JWT）
      responses:
        '200':
          description: 用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  # --- /user 面业务（tag: user；JWT 保护——Router 中间件，仅本人数据） ---
  # 注意 chi 路径顺序：/user/keys 必须先于 /user/keys/{id} 注册（生成器按 spec 顺序）。
  /user/groups:
    get:
      operationId: GetUserGroups
      tags: [user]
      summary: 可选组列表（public 全部 + 已授予 private；只读，key 创建时选组）
      responses:
        '200':
          description: 分组列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
  /user/keys:
    get:
      operationId: GetUserKeys
      tags: [user]
      summary: 我的 key 列表（分页/排序；KeyHash 永不下发）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: key 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyListResponse' }
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: PostUserKeys
      tags: [user]
      summary: 创建 key（组可选性校验：public 或已授予 private；raw 明文仅本次返回）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyCreate' }
      responses:
        '200':
          description: 创建后的 key + 明文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyWithSecret' }
        default:
          $ref: '#/components/responses/Error'
  /user/keys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetUserKeysId
      tags: [user]
      summary: key 详情（仅本人；他人 key → 404）
      responses:
        '200':
          description: key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Key' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutUserKeysId
      tags: [user]
      summary: 更新 key（name/status/max_concurrency/quota；仅本人）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyUpdate' }
      responses:
        '200':
          description: 更新后的 key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Key' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteUserKeysId
      tags: [user]
      summary: 删除 key（仅本人；Auth 快照增量移除——立即失效）
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /user/keys/{id}/rotate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: PostUserKeysIdRotate
      tags: [user]
      summary: 轮换 key（仅本人；新明文仅返回一次，旧 key 立即失效）
      responses:
        '200':
          description: 新 key 明文 + 更新后元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyWithSecret' }
        default:
          $ref: '#/components/responses/Error'
  /user/logs:
    get:
      operationId: GetUserLogs
      tags: [user]
      summary: 我的用量日志（强制 user_id = 当前用户，防越权）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: group_id, in: query, schema: { type: integer, format: int64 } }
        - { name: account_id, in: query, schema: { type: integer, format: int64 } }
        - { name: model, in: query, schema: { type: string } }
        - { name: status_code, in: query, schema: { type: integer } }
        - { name: error_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogsResponse' }
        default:
          $ref: '#/components/responses/Error'
  /user/stats:
    get:
      operationId: GetUserStats
      tags: [user]
      summary: 我的用量统计（强制 user_id = 当前用户）
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day], default: day } }
        - { name: group_id, in: query, schema: { type: integer, format: int64 } }
        - { name: account_id, in: query, schema: { type: integer, format: int64 } }
        - { name: model, in: query, schema: { type: string } }
      responses:
        '200':
          description: 统计桶数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StatBucket' }
        default:
          $ref: '#/components/responses/Error'
  /user/redemptions:
    post:
      operationId: PostUserRedemptions
      tags: [user]
      summary: 兑换码（400 invalid code：不存在/失效/过期/用尽，统一不泄露细节；409 already redeemed 重复兑换）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemRequest' }
      responses:
        '200':
          description: 兑换成功回执
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemResponse' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetUserRedemptions
      tags: [user]
      summary: 我的兑换记录（use 快照 + 码的 type/remark 联查；强制 user_id = 当前用户，防越权）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1, description: 页码（1-based） } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 1000 } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedemptionRecordListResponse' }
        default:
          $ref: '#/components/responses/Error'
  # 注意 chi 路径顺序：/rules 必须先于 /rules/{id} 注册（生成器按 spec 顺序注册）。
  /rules:
    get:
      operationId: ListRules
      tags: [rules]
      summary: 规则列表（enabled 过滤，priority 升序）
      parameters:
        - { name: enabled, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: 规则列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleListResponse' }
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: CreateRule
      tags: [rules]
      summary: 创建规则
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleCreate' }
      responses:
        '201':
          description: 创建后的规则
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        default:
          $ref: '#/components/responses/Error'
  /rules/batch-delete:
    post:
      operationId: PostRulesBatchDelete
      tags: [rules]
      summary: 批量删除规则（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: UpdateRule
      tags: [rules]
      summary: 更新规则（fields 任意子集，未提供字段保持原值）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RulePatch' }
      responses:
        '200':
          description: 更新后的规则
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteRule
      tags: [rules]
      summary: 删除规则
      responses:
        '204':
          description: 删除成功
        default:
          $ref: '#/components/responses/Error'
  /logs:
    get:
      operationId: GetLogs
      tags: [logs]
      summary: 用量日志分页查询
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: group_id, in: query, schema: { type: integer, format: int64 } }
        - { name: account_id, in: query, schema: { type: integer, format: int64 } }
        - { name: user_id, in: query, schema: { type: integer, format: int64, description: 按用户过滤（admin 看全部） } }
        - { name: model, in: query, schema: { type: string } }
        - { name: status_code, in: query, schema: { type: integer } }
        - { name: error_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogsResponse' }
        default:
          $ref: '#/components/responses/Error'
  /stats:
    get:
      operationId: GetStats
      tags: [stats]
      summary: 用量统计聚合
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day], default: day } }
        - { name: group_id, in: query, schema: { type: integer, format: int64 } }
        - { name: account_id, in: query, schema: { type: integer, format: int64 } }
        - { name: user_id, in: query, schema: { type: integer, format: int64, description: 按用户过滤（admin 看全部） } }
        - { name: model, in: query, schema: { type: string } }
      responses:
        '200':
          description: 统计桶数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StatBucket' }
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: 错误响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    DeletedResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean }
    RequestFormat:
      type: string
      enum: [openai-chat, openai-responses, anthropic]
    AccountStatus:
      type: string
      enum: [active, unhealthy, "429", disabled]
    ErrorType:
      type: string
      enum: [none, "429", "4xx", "5xx", network, auth, no_account, abort, billing]
    TemplateCreate:
      type: object
      required: [name, base_url, supported_formats]
      properties:
        name: { type: string }
        base_url: { type: string }
        # credential_type 模板级：一个模板 = 一种号池；缺省 = api_key。
        # 号池生态类型后续追加枚举（codex_oauth 等）。
        credential_type: { type: string, enum: [api_key], default: api_key }
        supported_formats:
          type: array
          minItems: 1
          items: { type: string, enum: [openai-chat, openai-responses, anthropic] }
        models:
          type: array
          items: { type: string }
        format_models:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        model_mapping:
          type: object
          additionalProperties: { type: string }
    Template:
      type: object
      required: [ID, Name, BaseURL, SupportedFormats, CreatedAt, UpdatedAt]
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        BaseURL: { type: string }
        CredentialType: { type: string }
        SupportedFormats:
          type: array
          items: { type: string, enum: [openai-chat, openai-responses, anthropic] }
        Models:
          type: array
          items: { type: string }
        FormatModels:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        ModelMapping:
          type: object
          additionalProperties: { type: string }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    AccountCreate:
      type: object
      required: [name, template_id, upstream_key]
      properties:
        name: { type: string }
        template_id: { type: integer, format: int64 }
        upstream_key: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        weight: { type: integer }
        max_concurrency: { type: integer }
        # 创建时可选：null/缺省 = 无分组；提供 = 替换语义（空数组 = 无分组）
        group_ids:
          type: array
          items: { type: integer, format: int64 }
    Account:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        TemplateID: { type: integer, format: int64 }
        Template: { $ref: '#/components/schemas/Template' }
        UpstreamKey: { type: string }
        Status: { $ref: '#/components/schemas/AccountStatus' }
        CooldownUntil: { type: string, format: date-time, nullable: true }
        Weight: { type: integer }
        MaxConcurrency: { type: integer }
        LastError: { type: string, nullable: true }
        LastUsedAt: { type: string, format: date-time, nullable: true }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    AccountView:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            concurrency: { type: integer, format: int64 }
            err_rate: { type: number, format: double }
            err_count: { type: integer }
    TemplateListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Template' }
    AccountListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/AccountView' }
    GroupListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Group' }
    GroupVisibility:
      type: string
      enum: [public, private]
    GroupAssignmentsBody:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          items: { type: integer, format: int64 }
          description: 替换语义：完整授予列表（未列出即撤销；空数组 = 清空）
    GroupAssignmentsResponse:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          items: { type: integer, format: int64 }
    KeyStatus:
      type: string
      enum: [active, disabled]
    Key:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        UserID: { type: integer, format: int64 }
        GroupID: { type: integer, format: int64 }
        Name: { type: string }
        KeyPrefix: { type: string }
        Status: { $ref: '#/components/schemas/KeyStatus' }
        MaxConcurrency: { type: integer }
        Quota: { type: integer, format: int64, description: 累计 token 上限；0 = 不限 }
        QuotaUsed: { type: integer, format: int64, description: 已消耗（后扣；无额度 key 恒 0） }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    KeyCreate:
      type: object
      required: [name, group_id]
      properties:
        name: { type: string }
        group_id: { type: integer, format: int64 }
        max_concurrency: { type: integer, description: 单 key 在途上限；0 = 不限 }
        quota: { type: integer, format: int64, description: 累计 token 上限；0 = 不限 }
    KeyUpdate:
      type: object
      properties:
        name: { type: string }
        status: { $ref: '#/components/schemas/KeyStatus' }
        max_concurrency: { type: integer }
        quota: { type: integer, format: int64 }
    KeyListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Key' }
    KeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/Key'
        - type: object
          required: [key]
          properties:
            key: { type: string, description: key 明文（创建/轮换响应仅返回一次；之后仅 KeyPrefix 可识别） }
    UserRole:
      type: string
      enum: [platform_admin, user]
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Email: { type: string }
        Role: { $ref: '#/components/schemas/UserRole' }
        Status: { $ref: '#/components/schemas/UserStatus' }
        MaxConcurrency: { type: integer }
        Balance: { type: number, format: double, description: 余额 USD（浮点；内部存储毫分——1 USD = 100,000 毫分，API 边界换算） }
        PriceMultiplier: { type: integer, nullable: true, description: 用户专属价格倍率（万分数，0 = 免费，10000 = ×1，上限 100000 = ×10）；null = 未设置（用组倍率） }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    UserAuthRegister:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    UserAuthLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    UserAuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    UserCreate:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        max_concurrency: { type: integer, description: 用户级在途上限；0 = 不限 }
        balance: { type: number, format: double, description: 余额 USD（浮点，≥ 0；1 USD = 100,000 毫分） }
        price_multiplier: { type: integer, minimum: 0, maximum: 100000, nullable: true, description: 用户专属价格倍率（万分数，0 = 免费，10000 = ×1）；null/缺省 = 未设置（用组倍率） }
    UserUpdate:
      type: object
      properties:
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        max_concurrency: { type: integer }
        balance: { type: number, format: double, description: 余额 USD（浮点，≥ 0；1 USD = 100,000 毫分） }
        price_multiplier: { type: integer, minimum: 0, maximum: 100000, nullable: true, description: 用户专属价格倍率（万分数，0 = 免费）；null = 清除为未设置（回退组倍率）；缺省 = 不变 }
    UserListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/User' }
    Setting:
      type: object
      properties:
        Key: { type: string }
        Type: { type: string, enum: [switch, number, string] }
        Value: { type: string }
        UpdatedAt: { type: string, format: date-time }
    SettingUpdate:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }
    GroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        visibility: { $ref: '#/components/schemas/GroupVisibility' }
        price_multiplier: { type: integer, minimum: 0, maximum: 100000, description: 价格倍率（万分数，0 = 免费，10000 = ×1，上限 100000）；缺省/null = 不设置（POST 落库组默认 10000；PUT 保持原值不变）。显式 0（免费组）请经 PUT 设置——POST 路径 0 视为未指定 }
    RuleCreate:
      type: object
      required: [name, priority]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        priority: { type: integer }
        when:
          type: object
          additionalProperties: true
        then:
          type: object
          additionalProperties: true
    RulePatch:
      type: object
      properties:
        name: { type: string }
        enabled: { type: boolean }
        priority: { type: integer }
        when:
          type: object
          additionalProperties: true
        then:
          type: object
          additionalProperties: true
    Rule:
      type: object
      required: [ID, Name, Enabled, Priority, When, Then, CreatedAt, UpdatedAt]
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        Enabled: { type: boolean }
        Priority: { type: integer }
        When:
          type: object
          additionalProperties: true
        Then:
          type: object
          additionalProperties: true
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    RuleListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Rule' }
    Group:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        Visibility: { $ref: '#/components/schemas/GroupVisibility' }
        PriceMultiplier: { type: integer, description: 价格倍率（万分数，0 = 免费，10000 = ×1，上限 100000 = ×10） }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    AccountGroupsResponse:
      type: object
      required: [group_ids]
      properties:
        group_ids:
          type: array
          items: { type: integer, format: int64 }
    BatchDeleteBody:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
    BatchUpdateTemplatesBody:
      type: object
      required: [ids, fields]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
        fields:
          $ref: '#/components/schemas/TemplatePatch'
    TemplatePatch:
      type: object
      properties:
        name: { type: string }
        base_url: { type: string }
        supported_formats:
          type: array
          minItems: 1
          items: { type: string, enum: [openai-chat, openai-responses, anthropic] }
        models:
          type: array
          items: { type: string }
        format_models:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        model_mapping:
          type: object
          additionalProperties: { type: string }
    AccountPatch:
      type: object
      properties:
        name: { type: string }
        template_id: { type: integer, format: int64 }
        upstream_key: { type: string }
        status: { type: string, enum: [active, unhealthy, "429", disabled] }
        weight: { type: integer }
        max_concurrency: { type: integer }
        # 替换语义：null/缺省 = 不变；[] = 清空；提供列表 = 替换账号全部分组
        group_ids:
          type: array
          items: { type: integer, format: int64 }
    GroupPatch:
      type: object
      properties:
        name: { type: string }
        visibility: { $ref: '#/components/schemas/GroupVisibility' }
    BatchUpdateAccountsBody:
      type: object
      required: [ids, fields]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
        fields: { $ref: '#/components/schemas/AccountPatch' }
    BatchUpdateGroupsBody:
      type: object
      required: [ids, fields]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
        fields: { $ref: '#/components/schemas/GroupPatch' }
    BatchDeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer }
    BatchUpdateResponse:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }
    # --- 兑换码（Phase 5 计费前基础设施：资源发放的通用载体） ---
    RedemptionType:
      type: string
      enum: [balance, concurrency, temp_balance]
    RedemptionStatus:
      type: string
      enum: [active, disabled]
    RedemptionCode:
      type: object
      required: [ID, Code, Type, Value, MaxUses, UsedCount, Status, CreatedBy, CreatedAt, UpdatedAt]
      properties:
        ID: { type: integer, format: int64 }
        Code: { type: string, description: XXXXXX-XXXXXX（生成后不可编辑，仅可失效） }
        Type: { $ref: '#/components/schemas/RedemptionType' }
        Value: { type: integer, format: int64, description: 最小单位（分/并发数） }
        Remark: { type: string, nullable: true }
        ExpiresAt: { type: string, format: date-time, nullable: true, description: 码未兑换即过期；null = 永久 }
        ResourceExpiresAt: { type: string, format: date-time, nullable: true, description: 兑换后资源到期；temp_balance 必有，其余恒 null }
        MaxUses: { type: integer, description: 1 = 单次码；>1 = 多人码 }
        UsedCount: { type: integer, description: 已兑换次数 }
        Status: { $ref: '#/components/schemas/RedemptionStatus' }
        CreatedBy: { type: integer, format: int64, description: 0 = 系统（静态 admin token）；>0 = platform_admin 用户 id }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    RedemptionUse:
      type: object
      required: [ID, CodeID, UserID, Value, CreatedAt]
      properties:
        ID: { type: integer, format: int64 }
        CodeID: { type: integer, format: int64 }
        UserID: { type: integer, format: int64 }
        Value: { type: integer, format: int64, description: 兑换时的值快照 }
        ResourceExpiresAt: { type: string, format: date-time, nullable: true }
        CreatedAt: { type: string, format: date-time }
    RedemptionRecord:
      type: object
      required: [ID, CodeID, Code, CodeType, Value, CreatedAt]
      properties:
        ID: { type: integer, format: int64 }
        CodeID: { type: integer, format: int64 }
        Code: { type: string }
        CodeType: { $ref: '#/components/schemas/RedemptionType' }
        Value: { type: integer, format: int64 }
        Remark: { type: string, nullable: true }
        ResourceExpiresAt: { type: string, format: date-time, nullable: true }
        CreatedAt: { type: string, format: date-time }
    RedemptionCodeListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/RedemptionCode' }
    RedemptionUseListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/RedemptionUse' }
    RedemptionRecordListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/RedemptionRecord' }
    GenerateRequest:
      type: object
      required: [type, value]
      properties:
        type: { $ref: '#/components/schemas/RedemptionType' }
        value: { type: integer, format: int64, description: 最小单位（分/并发数）；> 0 }
        remark: { type: string }
        expires_at: { type: string, format: date-time, description: 码未兑换即过期；缺省 = 永久 }
        resource_expires_at: { type: string, format: date-time, description: 兑换后资源到期；temp_balance 必填（决策 4） }
        max_uses: { type: integer, description: 1 = 单次码（缺省）；>1 = 多人码 }
        count: { type: integer, description: 生成个数 1-1000（缺省 1） }
    GenerateResponse:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { $ref: '#/components/schemas/RedemptionCode' }
    DeactivateRequest:
      type: object
      description: 单码失效无请求体（保留空 schema 对齐批量端点命名）
    DeactivateResponse:
      type: object
      required: [deactivated]
      properties:
        deactivated: { type: boolean }
    BatchDeactivateRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
    BatchDeactivateResponse:
      type: object
      required: [deactivated]
      properties:
        deactivated: { type: integer, description: 新失效数（已 disabled no-op 不计） }
    # --- litellm 模型价格（Phase 5 计费价格来源） ---
    PricingSource:
      type: string
      enum: [litellm, manual]
    Pricing:
      type: object
      required: [Model, PromptPricePerMillion, CompletionPricePerMillion, Source, CreatedAt, UpdatedAt]
      properties:
        Model: { type: string }
        PromptPricePerMillion: { type: integer, format: int64, description: 毫分/1M tokens（1 USD = 100,000 毫分） }
        CompletionPricePerMillion: { type: integer, format: int64, description: 毫分/1M tokens }
        MaxInputTokens: { type: integer, format: int64, nullable: true, description: litellm 自带上下文窗口；nil = 未知 }
        MaxOutputTokens: { type: integer, format: int64, nullable: true }
        CacheReadPricePerMillion: { type: integer, format: int64, nullable: true, description: 缓存读取价（litellm cache_read_input_token_cost 换算）；nil = 无缓存价 }
        CacheCreationPricePerMillion: { type: integer, format: int64, nullable: true, description: 缓存写入价（litellm cache_creation_input_token_cost 换算）；nil = 无缓存价 }
        PriorityPromptPricePerMillion: { type: integer, format: int64, nullable: true, description: service_tier=priority 单价替换档（毫分/1M tokens）；nil = 无该档价，计费回退基础价 }
        PriorityCompletionPricePerMillion: { type: integer, format: int64, nullable: true }
        PriorityCacheReadPricePerMillion: { type: integer, format: int64, nullable: true }
        PriorityCacheCreationPricePerMillion: { type: integer, format: int64, nullable: true }
        FlexPromptPricePerMillion: { type: integer, format: int64, nullable: true, description: service_tier=flex 单价替换档（毫分/1M tokens）；nil = 无该档价，计费回退基础价 }
        FlexCompletionPricePerMillion: { type: integer, format: int64, nullable: true }
        FlexCacheReadPricePerMillion: { type: integer, format: int64, nullable: true }
        FlexCacheCreationPricePerMillion: { type: integer, format: int64, nullable: true }
        AboveThreshold: { type: integer, format: int64, nullable: true, description: 上下文分段阈值（tokens）；nil = 无分段 }
        AbovePromptPricePerMillion: { type: integer, format: int64, nullable: true, description: 超阈值分段价（基础组，毫分/1M tokens）；nil = 该分量不拆段 }
        AboveCompletionPricePerMillion: { type: integer, format: int64, nullable: true }
        AboveCacheReadPricePerMillion: { type: integer, format: int64, nullable: true }
        AboveCacheCreationPricePerMillion: { type: integer, format: int64, nullable: true }
        AbovePriorityPromptPricePerMillion: { type: integer, format: int64, nullable: true, description: 超阈值分段价（priority 组，azure 形态）；nil = 该档回退基础 above 组 }
        AbovePriorityCompletionPricePerMillion: { type: integer, format: int64, nullable: true }
        AbovePriorityCacheReadPricePerMillion: { type: integer, format: int64, nullable: true }
        AbovePriorityCacheCreationPricePerMillion: { type: integer, format: int64, nullable: true }
        AboveFlexPromptPricePerMillion: { type: integer, format: int64, nullable: true, description: 超阈值分段价（flex 组，gpt-5.6-sol 形态）；nil = 该档回退基础 above 组 }
        AboveFlexCompletionPricePerMillion: { type: integer, format: int64, nullable: true }
        AboveFlexCacheReadPricePerMillion: { type: integer, format: int64, nullable: true }
        AboveFlexCacheCreationPricePerMillion: { type: integer, format: int64, nullable: true }
        FastMultiplier: { type: integer, format: int64, nullable: true, description: Anthropic Fast Mode 整单倍率（万分数，20000 = ×2.0）；nil = 无倍率 }
        Provider: { type: string, nullable: true, description: litellm_provider（litellm 行才有；manual 行 nil） }
        Mode: { type: string, nullable: true, description: litellm mode（chat/completion/embedding 等） }
        SupportsPromptCaching: { type: boolean, nullable: true, description: litellm supports_prompt_caching }
        Source: { $ref: '#/components/schemas/PricingSource' }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    PricingUpsert:
      type: object
      required: [prompt_price_per_million, completion_price_per_million]
      properties:
        prompt_price_per_million: { type: integer, format: int64, minimum: 0, description: 毫分/1M tokens；≥ 0 }
        completion_price_per_million: { type: integer, format: int64, minimum: 0 }
        cache_read_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true, description: 缓存读取价（毫分/1M tokens）；缺省 = 不设缓存价（落库 NULL） }
        cache_creation_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true, description: 缓存写入价；缺省 = 不设缓存价（落库 NULL） }
        priority_prompt_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true, description: service_tier=priority 单价替换档（毫分/1M tokens）；缺省/null = 不设（落库 NULL，计费回退基础价） }
        priority_completion_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        priority_cache_read_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        priority_cache_creation_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        flex_prompt_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true, description: service_tier=flex 单价替换档（毫分/1M tokens）；缺省/null = 不设（落库 NULL，计费回退基础价） }
        flex_completion_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        flex_cache_read_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        flex_cache_creation_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        above_threshold: { type: integer, format: int64, minimum: 0, nullable: true, description: 上下文分段阈值（tokens）；缺省/null = 不设（无分段） }
        above_prompt_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true, description: 超阈值分段价（基础组，毫分/1M tokens）；缺省/null = 该分量不拆段 }
        above_completion_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        above_cache_read_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        above_cache_creation_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        above_priority_prompt_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true, description: 超阈值分段价（priority 组，azure 形态）；缺省/null = 该档回退基础 above 组 }
        above_priority_completion_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        above_priority_cache_read_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        above_priority_cache_creation_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        above_flex_prompt_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true, description: 超阈值分段价（flex 组，gpt-5.6-sol 形态）；缺省/null = 该档回退基础 above 组 }
        above_flex_completion_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        above_flex_cache_read_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        above_flex_cache_creation_price_per_million: { type: integer, format: int64, minimum: 0, nullable: true }
        fast_multiplier: { type: integer, format: int64, minimum: 1, maximum: 100000, nullable: true, description: Anthropic Fast Mode 整单倍率（万分数，0 < m ≤ 100000，20000 = ×2.0）；缺省/null = 不设 }
    PricingListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Pricing' }
    PricingSyncResponse:
      type: object
      required: [rows, skipped, updated]
      properties:
        rows: { type: integer, description: 拉取到的有效模型行数 }
        skipped: { type: integer, description: 解析时跳过的非法行数 }
        updated: { type: integer, description: upsert 落库数（manual 行不计） }
    RedeemRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    RedeemResponse:
      type: object
      required: [applied]
      properties:
        applied:
          type: object
          required: [type, value]
          properties:
            type: { $ref: '#/components/schemas/RedemptionType' }
            value: { type: integer, format: int64 }
            resource_expires_at: { type: string, format: date-time, nullable: true }
    UsageLog:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        RequestID: { type: string }
        GroupID: { type: integer, format: int64 }
        AccountID: { type: integer, format: int64 }
        TemplateID: { type: integer, format: int64 }
        UserID: { type: integer, format: int64, description: 鉴权归属用户；0 = 无 }
        KeyID: { type: integer, format: int64, description: 鉴权归属 key；0 = 无 }
        Model: { type: string }
        MappedModel: { type: string, nullable: true }
        Format: { $ref: '#/components/schemas/RequestFormat' }
        StatusCode: { type: integer }
        ErrorType: { $ref: '#/components/schemas/ErrorType' }
        LatencyMS: { type: integer, format: int64 }
        InputTokens: { type: integer, format: int64 }
        OutputTokens: { type: integer, format: int64 }
        TotalTokens: { type: integer, format: int64 }
        CacheReadTokens: { type: integer, format: int64 }
        CacheCreationTokens: { type: integer, format: int64 }
        Cost: { type: integer, format: int64, description: 计费成本（毫分，1 USD = 100,000 毫分）；错误请求（402/4xx）为 0 }
        BillingTier: { type: string, description: 请求 service_tier 归一化值（priority/flex/fast/auto）；空 = 未计费路径 }
        AboveHit: { type: boolean, description: 任一分量超 above 阈值命中分段 }
        Overdraft: { type: boolean, description: 本次扣费透支（余额不足扣为负余额） }
        CreatedAt: { type: string, format: date-time }
    LogsResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/UsageLog' }
    StatBucket:
      type: object
      properties:
        BucketTime: { type: string, format: date-time }
        GroupID: { type: integer, format: int64 }
        AccountID: { type: integer, format: int64 }
        TemplateID: { type: integer, format: int64 }
        UserID: { type: integer, format: int64, description: 鉴权归属用户；0 = 无 }
        Model: { type: string }
        IsError: { type: boolean }
        RequestCount: { type: integer, format: int64 }
        ErrorCount: { type: integer, format: int64 }
        InputTokens: { type: integer, format: int64 }
        OutputTokens: { type: integer, format: int64 }
        TotalTokens: { type: integer, format: int64 }
        CacheReadTokens: { type: integer, format: int64 }
        CacheCreationTokens: { type: integer, format: int64 }
        Cost: { type: integer, format: int64, description: 计费成本（毫分，1 USD = 100,000 毫分；计费预聚合，花费统计不扫明细） }
        TotalLatencyMS: { type: integer, format: int64 }
