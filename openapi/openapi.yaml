openapi: 3.0.3
info:
  title: go-proxy-mini Admin API
  version: 1.0.0
  description: '管理端 API（模板/账号/分组/日志/统计）。认证：Authorization: Bearer <admin_token>。'
servers:
  - url: /admin
tags:
  - name: templates
  - name: accounts
  - name: groups
  - name: logs
  - name: stats
paths:
  /templates:
    post:
      operationId: PostTemplates
      tags: [templates]
      summary: 创建模板
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '200':
          description: 创建后的模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetTemplates
      tags: [templates]
      summary: 模板列表（分页/筛选/排序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: default_format, in: query, schema: { type: string, enum: [openai-chat, openai-responses, anthropic] } }
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/batch-delete:
    post:
      operationId: PostTemplatesBatchDelete
      tags: [templates]
      summary: 批量删除模板（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/batch-update:
    post:
      operationId: PostTemplatesBatchUpdate
      tags: [templates]
      summary: 批量更新模板（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateTemplatesBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetTemplatesId
      tags: [templates]
      responses:
        '200':
          description: 模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutTemplatesId
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreate' }
      responses:
        '200':
          description: 更新后模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteTemplatesId
      tags: [templates]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts:
    post:
      operationId: PostAccounts
      tags: [accounts]
      summary: 创建账号
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '200':
          description: 创建后的账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetAccounts
      tags: [accounts]
      summary: 账号列表（分页/筛选/排序，含运行时视图）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: status, in: query, schema: { type: string, description: 多值逗号分隔：active,unhealthy,429,disabled } }
        - { name: template_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 账号视图列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/batch-delete:
    post:
      operationId: PostAccountsBatchDelete
      tags: [accounts]
      summary: 批量删除账号（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/batch-update:
    post:
      operationId: PostAccountsBatchUpdate
      tags: [accounts]
      summary: 批量更新账号（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateAccountsBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetAccountsId
      tags: [accounts]
      responses:
        '200':
          description: 账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutAccountsId
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '200':
          description: 更新后账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteAccountsId
      tags: [accounts]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups:
    post:
      operationId: PostGroups
      tags: [groups]
      summary: 创建分组（响应含明文 key，仅此一次）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '200':
          description: 分组 + 明文 key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateGroupResponse' }
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: GetGroups
      tags: [groups]
      summary: 分组列表（分页/筛选/排序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 分组列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupListResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/batch-delete:
    post:
      operationId: PostGroupsBatchDelete
      tags: [groups]
      summary: 批量删除分组（事务，全成或全败）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchDeleteBody' }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDeleteResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/batch-update:
    post:
      operationId: PostGroupsBatchUpdate
      tags: [groups]
      summary: 批量更新分组（fields 为任意字段子集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchUpdateGroupsBody' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchUpdateResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: GetGroupsId
      tags: [groups]
      responses:
        '200':
          description: 分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: PutGroupsId
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '200':
          description: 更新后分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteGroupsId
      tags: [groups]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/{id}/accounts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: PutGroupsIdAccounts
      tags: [groups]
      summary: 全量绑定账号集合
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetGroupAccountsBody' }
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdatedResponse' }
        default:
          $ref: '#/components/responses/Error'
  /groups/{id}/rotate-key:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: PostGroupsIdRotateKey
      tags: [groups]
      summary: 轮换分组 key
      responses:
        '200':
          description: 新明文 key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotateKeyResponse' }
        default:
          $ref: '#/components/responses/Error'
  /logs:
    get:
      operationId: GetLogs
      tags: [logs]
      summary: 用量日志分页查询
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: group_id, in: query, schema: { type: integer, format: int64 } }
        - { name: account_id, in: query, schema: { type: integer, format: int64 } }
        - { name: model, in: query, schema: { type: string } }
        - { name: status_code, in: query, schema: { type: integer } }
        - { name: error_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogsResponse' }
        default:
          $ref: '#/components/responses/Error'
  /stats:
    get:
      operationId: GetStats
      tags: [stats]
      summary: 用量统计聚合
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day], default: day } }
        - { name: group_id, in: query, schema: { type: integer, format: int64 } }
        - { name: account_id, in: query, schema: { type: integer, format: int64 } }
        - { name: model, in: query, schema: { type: string } }
      responses:
        '200':
          description: 统计桶数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StatBucket' }
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: 错误响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    DeletedResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean }
    UpdatedResponse:
      type: object
      required: [updated]
      properties:
        updated: { type: boolean }
    RequestFormat:
      type: string
      enum: [openai-chat, openai-responses, anthropic]
    AccountStatus:
      type: string
      enum: [active, unhealthy, "429", disabled]
    ErrorType:
      type: string
      enum: [none, "429", "4xx", "5xx", network, auth, no_account, abort]
    TemplateCreate:
      type: object
      required: [name, base_url, default_format]
      properties:
        name: { type: string }
        base_url: { type: string }
        default_format: { $ref: '#/components/schemas/RequestFormat' }
        models:
          type: array
          items: { type: string }
        model_formats:
          type: object
          additionalProperties: { $ref: '#/components/schemas/RequestFormat' }
        model_mapping:
          type: object
          additionalProperties: { type: string }
    Template:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        BaseURL: { type: string }
        DefaultFormat: { $ref: '#/components/schemas/RequestFormat' }
        Models:
          type: array
          items: { type: string }
        ModelFormats:
          type: object
          additionalProperties: { $ref: '#/components/schemas/RequestFormat' }
        ModelMapping:
          type: object
          additionalProperties: { type: string }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    AccountCreate:
      type: object
      required: [name, template_id, upstream_key]
      properties:
        name: { type: string }
        template_id: { type: integer, format: int64 }
        upstream_key: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        weight: { type: integer }
        max_concurrency: { type: integer }
    Account:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        TemplateID: { type: integer, format: int64 }
        Template: { $ref: '#/components/schemas/Template' }
        UpstreamKey: { type: string }
        Status: { $ref: '#/components/schemas/AccountStatus' }
        CooldownUntil: { type: string, format: date-time, nullable: true }
        Weight: { type: integer }
        MaxConcurrency: { type: integer }
        LastError: { type: string, nullable: true }
        LastUsedAt: { type: string, format: date-time, nullable: true }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    AccountView:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            concurrency: { type: integer, format: int64 }
            err_rate: { type: number, format: double }
            err_count: { type: integer }
    TemplateListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Template' }
    AccountListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/AccountView' }
    GroupListResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Group' }
    GroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
    Group:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        KeyHash: { type: string }
        KeyPrefix: { type: string }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    CreateGroupResponse:
      type: object
      required: [group, key]
      properties:
        group: { $ref: '#/components/schemas/Group' }
        key: { type: string }
    RotateKeyResponse:
      type: object
      required: [key]
      properties:
        key: { type: string }
    SetGroupAccountsBody:
      type: object
      required: [account_ids]
      properties:
        account_ids:
          type: array
          items: { type: integer, format: int64 }
    BatchDeleteBody:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
    BatchUpdateTemplatesBody:
      type: object
      required: [ids, fields]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
        fields:
          $ref: '#/components/schemas/TemplatePatch'
    TemplatePatch:
      type: object
      properties:
        name: { type: string }
        base_url: { type: string }
        default_format: { type: string, enum: [openai-chat, openai-responses, anthropic] }
        models:
          type: array
          items: { type: string }
        model_formats:
          type: object
          additionalProperties: { type: string }
        model_mapping:
          type: object
          additionalProperties: { type: string }
    AccountPatch:
      type: object
      properties:
        name: { type: string }
        template_id: { type: integer, format: int64 }
        upstream_key: { type: string }
        status: { type: string, enum: [active, unhealthy, "429", disabled] }
        weight: { type: integer }
        max_concurrency: { type: integer }
    GroupPatch:
      type: object
      properties:
        name: { type: string }
    BatchUpdateAccountsBody:
      type: object
      required: [ids, fields]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
        fields: { $ref: '#/components/schemas/AccountPatch' }
    BatchUpdateGroupsBody:
      type: object
      required: [ids, fields]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 100
        fields: { $ref: '#/components/schemas/GroupPatch' }
    BatchDeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer }
    BatchUpdateResponse:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }
    UsageLog:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        RequestID: { type: string }
        GroupID: { type: integer, format: int64 }
        AccountID: { type: integer, format: int64 }
        TemplateID: { type: integer, format: int64 }
        Model: { type: string }
        MappedModel: { type: string, nullable: true }
        Format: { $ref: '#/components/schemas/RequestFormat' }
        StatusCode: { type: integer }
        ErrorType: { $ref: '#/components/schemas/ErrorType' }
        LatencyMS: { type: integer, format: int64 }
        PromptTokens: { type: integer, format: int64 }
        CompletionTokens: { type: integer, format: int64 }
        TotalTokens: { type: integer, format: int64 }
        CreatedAt: { type: string, format: date-time }
    LogsResponse:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/UsageLog' }
    StatBucket:
      type: object
      properties:
        BucketTime: { type: string, format: date-time }
        GroupID: { type: integer, format: int64 }
        AccountID: { type: integer, format: int64 }
        TemplateID: { type: integer, format: int64 }
        Model: { type: string }
        IsError: { type: boolean }
        RequestCount: { type: integer, format: int64 }
        ErrorCount: { type: integer, format: int64 }
        PromptTokens: { type: integer, format: int64 }
        CompletionTokens: { type: integer, format: int64 }
        TotalTokens: { type: integer, format: int64 }
        TotalLatencyMS: { type: integer, format: int64 }
