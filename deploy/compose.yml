# go-proxy-mini 部署编排：单应用容器（内嵌前端）+ PostgreSQL。
# volume 全部使用目录挂载（bind mount），数据与配置落盘在宿主，便于备份与升级。
#
# 用法：
#   cp deploy/config.toml.example deploy/config.toml   # 或直接用示例
#   ADMIN_TOKEN=$(openssl rand -hex 16) docker compose -f deploy/compose.yml up -d --build
#   # 或写入 .env（compose 自动读取同目录 .env）：ADMIN_TOKEN=xxx, PORT=18080

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpm}
      POSTGRES_DB: go_proxy_mini
    volumes:
      # 目录挂载：PG 数据落盘宿主 ./data/pg（备份/迁移直接拷目录）。
      # PG 18+ 要求挂载 /var/lib/postgresql（数据在 data 子目录，支持 pg_upgrade --link）
      - ./data/pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_proxy_mini"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 敏感项走环境变量（config.Load 支持 GPM_ADMIN_TOKEN / GPM_DB_DSN 覆盖）
      GPM_ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env (openssl rand -hex 16)}
      GPM_DB_DSN: postgres://postgres:${POSTGRES_PASSWORD:-gpm}@db:5432/go_proxy_mini?sslmode=disable
    ports:
      - "${PORT:-18080}:18080"
    volumes:
      # 目录挂载：配置只读注入（改配置重启即生效，不用重建镜像）
      - ./config.toml:/app/config.toml:ro
