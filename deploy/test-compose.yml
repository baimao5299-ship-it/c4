# repository 测试用独立 PostgreSQL（评审 B1：真实 PG 测试基座，测试代码在
# internal/repository/pg_account_groups_test.go，TEST_DATABASE_URL 驱动）。
#
# 用法：
#   docker compose -f deploy/test-compose.yml up -d
#   TEST_DATABASE_URL=postgres://postgres:gpm@localhost:15432/gpm_test \
#     go test ./internal/repository/ -run PG -v
#   docker compose -f deploy/test-compose.yml down
#
# 与生产 compose.yml 隔离：独立端口 15432、独立库名，不挂数据卷（可随时重建）。

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gpm
      POSTGRES_DB: gpm_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gpm_test"]
      interval: 5s
      timeout: 3s
      retries: 10
