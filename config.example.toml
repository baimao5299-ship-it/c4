server = { addr = ":8080", read_header_timeout = "10s", max_header_bytes = 1048576 }
log = { level = "warn", output = "stdout" }
admin = { token = "change-me" }
# JWT 密钥（强制，缺失启动失败；GPM_AUTH_JWT_SECRET 亦可）
auth = { jwt_secret = "change-me-too" }
db = { dsn = "postgres://user:pass@localhost:5432/go_proxy_mini?sslmode=disable", max_conns = 10 }
proxy = {
  max_body_size = 4194304,
  max_inflight = 50000,
  upstream_timeout = "120s",
  upstream_stream_timeout = "30m",
  failover_attempts = 3,
  usage_capture = true,
}
upstream = {
  max_idle_conns = 8192,
  max_idle_conns_per_host = 2048,
  idle_conn_timeout = "90s",
  dial_timeout = "10s",
  force_http2 = true,
}
limit = { group_key_rpm = 0 }
# cooldown_429 / backoff_base / backoff_max 已废弃：429 冷却与错误退避由规则引擎
# （种子规则 + /admin/rules 自定义规则）接管，旧键仅保留读取兼容、不参与决策。
scheduler = {
  default_max_concurrency = 8,
  sync_interval = "30s",
}
usage = {
  batch_size = 500,
  flush_interval = "500ms",
  log_retention_days = 30,
  stats_flush_interval = "10s",
}
# 计费（Phase 5）：默认关 opt-in。启用前需先同步价格（POST /admin/pricing/sync），
# 空价格表 = 全模型 402。启用后：请求前余额预检（快照缺失或 ≤0 → 402）、
# 临时额度 FEFO 优先扣、条件扣费允许透支、优雅停机排空不丢计费。
billing = { enabled = false, flush_interval = "1s", balance_refresh_interval = "10s" }
