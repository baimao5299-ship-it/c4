server = { addr = ":8080", read_header_timeout = "10s", max_header_bytes = 1048576, time_zone = "" } # IANA 名（如 Asia/Shanghai）；空=进程本地
log = { level = "warn", output = "stdout" }
# 敏感项（auth.jwt_secret / db.dsn）必填，强制经 env 注入：
#   export C3API_AUTH_JWT_SECRET=xxx / C3API_DB_DSN=xxx
# admin.token 用于首次管理登录；生产部署应通过 C3API_ADMIN_TOKEN 注入随机长值。
# allow_first_user_admin 默认关闭，避免公开注册者意外获得管理员权限。仅在
# 已受控的首次初始化环境中显式设为 true，完成 bootstrap 后立即关闭注册。
# 示例不留占位值——占位符（change-me 等）会被 Load 拒绝，防原样部署鉴权绕过。
admin = { token = "" }
# JWT 密钥（强制，缺失启动失败；须经 C3API_AUTH_JWT_SECRET 注入）
auth = { jwt_secret = "", allow_first_user_admin = false, login_rate_per_minute = 20, register_rate_per_minute = 5, code_rate_per_minute = 3, reset_rate_per_minute = 5 }
db = { dsn = "postgres://user:pass@localhost:5432/c3api?sslmode=disable", max_conns = 20 } # #17：10→20（billing 8 + stats 8 worker + 余量；统计批量写已改 COPY 毫秒级短事务）
# Redis 必需依赖（实例发现等易失协调态；spec 2026-08-25-redis-foundation-design）：
# addr 必填，空/不可达启动即失败；env 覆盖 C3API_REDIS_ADDR / C3API_REDIS_PASSWORD
# / C3API_REDIS_DB。password 空 = 无鉴权（占位值 change-me 等会被拒绝）；db <0 非法。
redis = { addr = "127.0.0.1:6379", password = "", db = 0 }
proxy = {
  max_body_size = 4194304,
  # 非流式上游响应内存上限（默认 32 MiB）；流式响应由超时与背压保护。
  max_response_size = 33554432,
  max_inflight = 50000,
  # upstream_timeout 保留段名（改名 proxy_timeout 会使旧键无字段对应 → ErrorUnused
  # 启动报错）；同源供 http.Server.ReadTimeout（slowloris 截断，见 main.go）。
  upstream_timeout = "120s",
  upstream_stream_timeout = "30m",
  # 总尝试次数（含首次）——>= 1，0 会启动失败（拒绝死锁配置）
  failover_attempts = 3,
  usage_capture = true,
  # behind_cdn=true 时可限制来源头只接受指定反代网段；留空保持兼容。
  # trusted_proxy_cidrs = ["127.0.0.1/32", "::1/128"],
}
upstream = {
  max_idle_conns = 8192,
  max_idle_conns_per_host = 2048,
  idle_conn_timeout = "90s",
  dial_timeout = "10s",
  force_http2 = true,
  tls_convergence_enabled = false,
  # 留空=直连；手动填写本机代理，例如 http://host.docker.internal:7897
  # 或 socks5h://host.docker.internal:7898。不会读取 HTTP_PROXY 环境变量。
  proxy_url = "",
}
limit = { group_key_rpm = 0 }
# cooldown_429 / backoff_base / backoff_max 已移除（不向后兼容）——配置含这些
# 键将启动失败；429 冷却与错误退避由规则引擎（种子规则 +
# /api/admin/rules 自定义规则）接管。
scheduler = {
  default_max_concurrency = 8,
  sync_interval = "30s",
}
usage = {
  batch_size = 500,
  flush_interval = "500ms",
  # usagelog 按日分区保留天数（Phase 5 T4.5）：保留期外分区由 retention worker
  # DROP TABLE O(1) 清理（默认 30 天 = 30 个日分区）；<= 0 = 不删除。
  log_retention_days = 30,
  quota_flush_interval = "10s",
  # 使用量统计离线聚合周期（usage_stats 分区表的写入 cadence；0 = 禁用聚合）。
  stats_agg_interval = "5m",
  # flush_workers：明细/统计/额度 flush 并行 worker 数（默认 8——多角度压测
  # C 项实证 2026-08-12：多用户水线告警清零、pending 斜率降 25-40%、QPS/CPU
  # 零回退；每 worker 一笔批量 SQL，受 DB 连接池余量 db.max_conns 约束；
  # 同 key 恒同 worker，分片确定性）。
  flush_workers = 8,
  # err_logs 错误审计明细（分表设计）：有界队列 + 背压采样丢弃——拒绝风暴不
  # 阻塞热路径/不爆内存/不淹没 DB（DB 写速率上界 = errlog_batch_size /
  # errlog_flush_interval）。双轨行（abort 等已计费错误）豁免采样恒落盘。
  # errlog_queue_size = 4096,          # 拒绝队列容量（满 → 丢弃采样）
  # errlog_batch_size = 500,           # 每批落盘行数
  # errlog_flush_interval = "500ms",   # 批间隔
  # errlog_retention_days = 7,         # err_logs 分区保留天数（默认 7 天短保留）
  # stats_retention_days = 180,        # usage_stats 分区保留天数（默认 180 天；
  #                                    # 聚合统计也分区化——清理 DROP 分区 O(1)，
  #                                    # PG DELETE 不释放空间）
}
# 计费（Phase 5）：默认开启（与代码默认一致）。首次启动后需先同步价格
# （POST /api/admin/pricing/sync）——空价格表 = 全模型 402。开启后：请求前余额
# 预检（快照缺失或 <0 → 402——余额 0 放行，临时额度由 FEFO 扣费消化）、临时额度 FEFO 优先扣、条件扣费允许透支、
# 优雅停机排空不丢计费。enabled = false 退回纯代理模式（不计费不扣费）。
# flush_interval：计费游标轮询周期（F2 ledger-cursor：billable 行由 usage
# flusher 单写落库 billed=false，本 worker 每周期取批消费 unbilled 账本——
# FEFO 扣减与 billed 标记同事务原子；停机排空受 shutdown 预算约束，超时 Warn
# 截断不阻塞退出）。
# flush_workers：用户组并行消费 worker 数（默认 8——每 worker 一笔
# DeductOnlyAndMark 事务，受 DB 连接池余量 db.max_conns 约束；多实例由会话级
# advisory lock 取批互斥）。
billing = { enabled = true, flush_interval = "250ms", balance_refresh_interval = "10s", flush_workers = 8 }
# 可选：按模板 ID 配置供应商余额查询。键是 template_id；不配置的模板
# 显示“未配置”，不会把未知余额当成 0。相对 endpoint 会拼接账号有效 BaseURL。
# [billing.balance_adapters."1"]
# provider = "relay-a"
# endpoint = "/v1/dashboard/balance"
# method = "GET"
# auth = "bearer"                 # none | bearer | api_key
# balance_path = "data.balance"   # JSON 点路径
# currency_path = "data.currency"
# timeout = "8s"
# max_response_size = 1048576
